<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kiểm tra plugin · Lý Thuyết Lái Xe</title><style>@font-face{font-family:Nunito;src:url('/ui/assets/nunito-latin-400-normal.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}@font-face{font-family:Nunito;src:url('/ui/assets/nunito-vietnamese-400-normal.woff2') format('woff2');unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}*{box-sizing:border-box}body{margin:0;background:#eef3e8;color:#203b30;font:14px/1.65 Nunito,sans-serif}main{max-width:1120px;margin:24px auto;padding:0 20px}header{margin-bottom:18px}h1{font-size:20px;margin:0}p{max-width:75ch}header{border-bottom:1px solid #d5e0ce;padding-bottom:16px}iframe{display:block;width:100%;height:850px;border:0}#host-message{white-space:pre-wrap;overflow-wrap:anywhere;padding:20px;background:#e5f4fb;border-radius:12px}#host-message:empty{display:none}a{color:#176d96}@media(max-width:700px){main{margin:12px auto;padding:0 10px}}:root[data-theme="dark"] body{background:#101214;color:#f0f4f1}:root[data-theme="dark"] header{border-color:#3b4340}:root[data-theme="dark"] #host-message{background:#202f3b}:root[data-theme="dark"] a{color:#a2dcf5}</style></head><body><main><header><h1>Kiểm tra widget MCP Apps</h1><p>Host phát triển dùng cùng công cụ máy chủ. Host này không chạy ChatGPT; yêu cầu giải thích chỉ được hiển thị bên dưới để kiểm tra ngữ cảnh.</p></header><iframe id="widget" src="/ui/learning.html" title="Lý Thuyết Lái Xe"></iframe><div id="host-message" role="status" aria-live="polite"></div></main><script>
'use strict';document.documentElement.dataset.theme=new URLSearchParams(location.search).get('theme')==='dark'?'dark':'light';const frame=document.querySelector('#widget'),output=document.querySelector('#host-message');let initialized=false;const verifiedLinks=new Set();function rememberLinks(value){if(!value||typeof value!=='object')return;if(value.verified===true&&typeof value.url==='string'){try{const u=new URL(value.url);if(['https:','http:'].includes(u.protocol))verifiedLinks.add(u.href);}catch{}}for(const child of Object.values(value))if(child&&typeof child==='object')rememberLinks(child);}const endpoint=location.pathname.startsWith('/play')?'/play/tool':'/preview/tool';
function send(message){frame.contentWindow.postMessage({jsonrpc:'2.0',...message},location.origin);}
window.addEventListener('message',async event=>{if(event.source!==frame.contentWindow||event.origin!==location.origin)return;const m=event.data;if(!m||m.jsonrpc!=='2.0')return;if(m.method==='ui/notifications/size-changed'){const height=Number(m.params?.height);if(Number.isFinite(height)&&height>0)frame.style.height=Math.min(10000,Math.ceil(height))+'px';return;}if(m.id===undefined)return;try{let result={};if(m.method==='ui/initialize'){initialized=true;result={protocolVersion:'2026-01-26',hostInfo:{name:'local-development-host',version:'1.0.0'},hostCapabilities:{serverTools:{},...(new URLSearchParams(location.search).has('chat')?{message:{text:true}}:{}),updateModelContext:{text:true},openLinks:{}},hostContext:{theme:new URLSearchParams(location.search).get('theme')==='dark'?'dark':'light',displayMode:'inline'}};}else{if(!initialized)throw new Error('Widget chưa khởi tạo');if(m.method==='tools/call'){const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(m.params)});if(!response.ok)throw new Error('Máy chủ trả lỗi '+response.status);result=await response.json();rememberLinks(result);}else if(m.method==='ui/message'){output.textContent='Yêu cầu đã nhận ở host phát triển; ChatGPT không chạy tại đây.\n\n'+(m.params?.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('\n');}else if(m.method==='ui/update-model-context'){result={};}else if(m.method==='ui/open-link'){const u=new URL(m.params?.url);if(!['https:','http:'].includes(u.protocol)||!verifiedLinks.has(u.href))throw new Error('Host chỉ mở liên kết có nguồn đã xác minh từ máy chủ');window.open(u.href,'_blank','noopener,noreferrer');}else throw new Error('Host không hỗ trợ '+m.method);}send({id:m.id,result});}catch(e){send({id:m.id,error:{code:-32000,message:e.message}});}});
</script></body></html>
