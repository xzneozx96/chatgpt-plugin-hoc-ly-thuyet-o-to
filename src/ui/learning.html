function questionMarkup(q,readonly=false){if(!q)return '<p class="empty">Không còn câu hỏi trong lượt này.</p>';const key=`${lastIdentity}:${qid(q)}`;const picked=drafts.has(key)?drafts.get(key):selection;const opts=Array.isArray(q.options)?q.options:Object.entries(q.options||{}).map(([id,text])=>({id,text}));const image=q.imageUrl||(q.imagePath?'{{BASE_URL}}/'+q.imagePath.replace(/^\//,''):null)||q.image?.url;const source=image&&safeImage(image);return `<h2>${E(q.question||q.text||q.prompt)}</h2><div class="activity-meta">Câu ${E(q.number||qid(q))}${q.isCritical||q.critical?' · Câu điểm liệt':''}</div>${source?`<button class="question-image-button" data-action="zoom" data-value="${E(source)}" aria-label="Phóng to hình câu hỏi"><img class="question-image" src="${E(source)}" alt="${E(q.imageAlt||'Hình minh họa câu hỏi gốc')}"></button>`:''}<fieldset class="options" ${readonly?'disabled':''}><legend>${readonly?'Đáp án đã trả lời':'Chọn một đáp án'}</legend>${opts.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${E(choiceKey(o,i))}" ${picked===choiceKey(o,i)?'checked':''}><span><b>${E(choiceKey(o,i))}.</b> ${E(o.text||o.label||o)}</span></label>`).join('')}</fieldset>`;}
function safeImage(url){try{const u=new URL(url,'{{BASE_URL}}');return /^https?:$/.test(u.protocol)?u.href:null;}catch{return null;}}
function progressMarkup(p={}){return `<span class="count">${E(p.covered??p.coverage??0)}/${E(p.total??p.questionCount??p.questionIds?.length??0)}<small>Đã thử · ${E(p.learned??p.mastered??0)} đã nhớ</small></span>`;}
function courseMarkup(){const c=course||view||{},p=c.profile||{},summary=c.summary||c.progress||{},categories=[...(c.categories||c.units||[]),...(c.customCategory?[c.customCategory]:[])];return `<div class="intro"><h1>Khóa học bằng B</h1><p>Đi từng chủ đề, hiểu điểm khác nhau và ôn lại đúng lúc.</p></div>${!savedAvailable()?'<div class="persistence-note"><strong>Lịch sử học chưa khả dụng</strong><p>Bạn có thể luyện câu gốc. Đáp án luyện tập không lưu tiến độ; mục tiêu, lịch ôn và bài thi cần cấu hình tài khoản.</p></div>':''}<div class="overview"><aside class="today"><h2>Hôm nay</h2><p>${E(c.today?.dueCount??c.dueCount??summary.dueCount??0)} câu đến hạn ôn · ${E(p.dailyGoal??p.newQuestionGoal??12)} câu mới dự kiến.</p>${B('Học tiếp hôm nay','daily',true,!savedAvailable())}${(c.sessions||[]).filter(x=>x.status==='active'||x.status==='paused').slice(-1).map(x=>actions(B(x.status==='paused'?'Tiếp tục buổi đã dừng':'Mở buổi đang học',x.status==='paused'?'resume':'inspect-session',false,false,x.id))).join('')}<small>Ôn các câu đến hạn trước. Tạm dừng và tiếp tục bất cứ lúc nào.</small><div class="today-goal"><span>Mục tiêu câu mới</span><strong>${E(p.dailyGoal??p.newQuestionGoal??12)} câu mỗi ngày</strong>${B('Thay đổi mục tiêu','goals',false,!savedAvailable())}</div></aside><section class="course"><div class="section-title"><h2>Nội dung khóa học</h2><span>Tiến độ do máy chủ ghi nhận</span></div><div class="course-list">${categories.filter(x=>x.kind!=='family').map((u,i)=>`<button class="course-row" data-action="${u.id==='de_nham_lan'?'families':'unit'}" data-value="${E(u.id)}"><span class="chapter">${i+1}</span><span class="course-label"><strong>${E(u.title||u.name)}</strong><small>${E(u.description||'Câu hỏi gốc trong chủ đề')}</small></span>${progressMarkup(u.progress||u)}</button>`).join('')}</div>${actions(B('Duyệt chủ đề','categories'),B('Nhóm dễ nhầm lẫn','families'))}<small class="footnote">Câu trùng giữa các nhóm chỉ tính một lần trong tổng tiến độ. Nhóm dễ nhầm là danh mục nháp để khám phá.</small></section></div>`;}
function unitsMarkup(){const u=units||{};return `<h1>${unitKind==='family'?'Nhóm dễ nhầm lẫn':'Chủ đề học'}</h1><p class="note">${unitKind==='family'?'249 nhóm chồng lặp từ câu gốc. Danh mục nháp, chưa phải nội dung dạy đã duyệt.':'Chọn một chủ đề để bắt đầu.'}</p><form id="unit-search"><label for="search">Tìm tên nhóm hoặc số câu</label><input id="search" class="search-field" value="${E(search)}" placeholder="Ví dụ: tốc độ hoặc 145"><button type="submit">Tìm kiếm</button></form><p class="note">${E(u.totalMatches??u.total??0)} kết quả</p><div class="course-list">${(u.units||u.items||[]).map(x=>`<button class="course-row" data-action="unit" data-value="${E(x.id)}"><span class="course-label"><strong>${E(x.title||x.name)}</strong><small>${E(x.questionCount??x.total??0)} câu gốc${x.requiresVisualReview?' · Cần kiểm tra hình':''}</small></span>${progressMarkup(x.progress||x)}</button>`).join('')||'<p class="empty">Không có nhóm phù hợp. Thử từ khóa khác.</p>'}</div>${actions(B('Trang trước','units-prev',false,page===0),B('Trang tiếp','units-next',false,!(u.nextOffset!==null&&u.nextOffset!==undefined||u.hasMore||u.has_more)),B('Về khóa học','course'))}`;}
function goalsMarkup(){const goal=course?.profile?.dailyGoal??12;return `<h1>Mục tiêu mỗi ngày</h1><p>Số câu mới mỗi ngày. Các câu đến hạn ôn được cộng riêng.</p><form id="goal-form"><fieldset class="goal-options"><legend>Chọn nhịp học</legend>${[10,12,15].map(n=>`<label class="goal-choice"><input type="radio" name="goal" value="${n}" ${n===goal?'checked':''}><span><b>${n} câu mới</b></span></label>`).join('')}<label class="goal-choice"><input type="radio" name="goal" value="custom"><span>Tùy chọn</span></label></fieldset><label for="custom-goal">Số câu tùy chọn (1–600)</label><input id="custom-goal" type="number" min="1" max="600" value="${E(goal)}" class="search-field"><div class="actions"><button class="primary" type="submit">Lưu mục tiêu</button>${B('Quay lại','course')}</div></form>`;}
function feedbackMarkup(f){if(!f)return '';const q=f.question||question();const correct=f.correct??f.isCorrect;return `<div class="verdict ${correct?'':'wrong'}"><strong>${correct?'Trả lời đúng':'Cần xem lại'}</strong><p>Đáp án gốc: ${E(f.correctAnswer??f.correctKey??'Xem đáp án trong nguồn')}</p></div><div class="inline-teaching"><h3>Đáp án và giải thích gốc</h3><p class="note">Giải thích từ dữ liệu câu gốc chưa được duyệt làm bài giảng. Nguồn kiến thức và video được duyệt chưa kết nối.</p><p>${E(f.explanation||q?.explanation||'Chưa có giải thích đã duyệt cho câu này. Hãy nhờ ChatGPT làm rõ dựa trên câu và đáp án gốc.')}</p>${f.memoryTip?`<p>${E(f.memoryTip)}</p>`:''}<small>${E(f.source?.title||f.sourceId||'Đáp án: bộ câu hỏi gốc')}</small>${(f.sources||[]).filter(s=>s.verified===true&&safeImage(s.url)).map(s=>`<p><button data-action="source" data-value="${E(s.url)}">${E(s.title||'Mở nguồn đã xác minh')}</button></p>`).join('')}</div>`;}
function studyMarkup(){const s=view,q=question(),f=s.currentFeedback;if(s.status==='paused')return `<h1>Buổi học đã tạm dừng</h1><p>Các câu chưa làm và lịch ôn vẫn được giữ trên máy chủ.</p>${actions(B('Tiếp tục','resume',true,false,s.sessionId),B('Về khóa học','course'))}`;if(['completed','complete'].includes(s.status))return `<h1>Hoàn thành lượt học</h1><p>${E(s.completed??s.summary?.answered??s.completedCount??0)} câu đã trả lời trong lượt này. Kết quả tức thì không tự xác nhận đã nhớ lâu.</p>${actions(B('Xem tiến độ','course',true))}`;return `<h1>${E(s.title||'Buổi học hôm nay')}</h1><p class="note">${s.override?`Bạn đã chọn học riêng; ${E(s.pendingDue)} câu đến hạn vẫn chờ ôn. `:''}Ước tính riêng: ${E(s.estimatedMinutes?.review??0)} phút ôn · ${E(s.estimatedMinutes?.new??0)} phút học mới.</p><div class="activity-meta">${E(s.completed??s.completedCount??s.position??0)}/${E(s.totalCount??s.total??0)} câu đã xử lý · Lịch ôn cố định trong buổi học</div>${questionMarkup(f?.question||q,Boolean(f))}${feedbackMarkup(f)}${!f&&(s.teaching||s.help)?`<div class="inline-teaching"><h3>Hỗ trợ từ nguồn</h3><p>${E(s.teaching?.explanation||s.teaching?.message||s.help?.explanation||'Nguồn chưa có giải thích. Kho kiến thức bổ sung chưa kết nối.')}</p><small>${E(s.teaching?.source||s.help?.sourceId)} · Kho kiến thức và video bổ sung chưa kết nối.</small></div>`:''}${f?actions(B('Câu tiếp theo','study-next',true),B('Nhờ ChatGPT giải thích','help')):`<fieldset class="confidence"><legend>Mức tự tin · không bắt buộc</legend><div class="segmented"><label><input type="radio" name="confidence" value="confident" ${confidence==='confident'?'checked':''}>Tôi tự tin</label><label><input type="radio" name="confidence" value="guess" ${confidence==='guess'?'checked':''}>Tôi đoán</label></div></fieldset>${actions(B('Trả lời','answer',true,selection===null),B('Nhờ ChatGPT gợi ý','help'))}`}<details class="more-actions"><summary>Tùy chọn buổi học</summary>${actions(B(s.confusionEnabled||s.confused||q?.confused?'Bỏ dấu phân vân':'Tôi còn phân vân','confusion'),B('Bỏ qua, giữ câu đến hạn','skip',false,Boolean(f)),B('Tạm dừng','pause'))}</details>`;}
function mockMarkup(){const m=view;if(m.status==='abandoned')return `<h1>Đã dừng bài thi</h1><p>Lựa chọn tạm không được chấm hoặc tính vào lịch sử học.</p>${actions(B('Về khóa học','course',true))}`;if(['finalised','finalized','completed'].includes(m.status)||m.result){const r=m.result||m;return `<h1>Kết quả thi thử</h1><h2>${E(r.score??r.correctCount??r.correct??0)}/30 · ${r.passed?'Đạt':'Chưa đạt'}</h2><div class="verdict ${r.passed?'':'wrong'}"><strong>${(r.criticalFailures?.length||r.criticalFailure)?'Có câu điểm liệt sai hoặc bỏ trống':r.passed?'Đủ điểm theo cấu hình thi':'Chưa đủ điểm theo cấu hình thi'}</strong></div><p>${E(r.unansweredCount??r.results?.filter(x=>x.unanswered).length??0)} câu bỏ trống · ${E(r.wrongCount??r.results?.filter(x=>x.correct===false).length??0)} câu trả lời sai.</p><details class="progress-details"><summary>Xem câu cần học lại</summary>${(r.results||[]).filter(x=>x.correct===false||x.unanswered).map(x=>{const q=m.questions?.find(q=>qid(q)===x.questionId);return `<section class="answer-line"><h3>Câu ${E(x.questionId)}</h3><p>${E(q?.question)}</p><p>${x.unanswered?'Chưa trả lời':`Đã chọn ${E(x.selectedAnswer)}`} · Đáp án gốc ${E(x.correctAnswer)}</p>${x.explanation?`<p>${E(x.explanation)}</p>`:''}<small class="note">Câu gốc: ${E(q?.sourceId||x.questionId)} · Giải thích chưa được duyệt làm bài giảng.</small></section>`;}).join('')||'<p>Không có câu sai hoặc bỏ trống.</p>'}</details>${actions(B('Về khóa học','course',true),B('Thi lượt khác','mock-entry'))}`;}const qs=m.questions||[],q=question(),saved=m.answers||m.choices||{},answer=saved[qid(q)];selection=typeof answer==='object'?answer?.answer:answer??null;return `<div class="test-top"><h1>Thi thử ngẫu nhiên</h1><span class="timer" id="timer" aria-label="Thời gian còn lại"></span></div><p class="note">Câu ${mockIndex+1}/30 · Bộ đề riêng chưa được cung cấp.</p>${questionMarkup(q)}<p class="note">${drafts.has(`${lastIdentity}:${qid(q)}`)?'Lựa chọn chưa xác nhận lưu.':'Đáp án hiển thị là lựa chọn máy chủ đã lưu.'}</p><details class="test-index"><summary>Danh sách 30 câu</summary><div class="navigator">${qs.map((x,i)=>B(String(i+1),'mock-nav',false,false,i).replace('class=""',`class="${saved[qid(x)]?'answered':''} ${i===mockIndex?'active':''}"`)).join('')}</div></details>${actions(B('Câu trước','mock-prev',false,mockIndex===0),B('Câu tiếp','mock-next',true,mockIndex>=qs.length-1),B('Nộp bài','mock-confirm'))}<details class="more-actions"><summary>Tùy chọn bài thi</summary>${actions(B('Dừng thi và học','mock-leave'))}</details>`;}
function render(){document.querySelectorAll('.brand nav button').forEach(x=>{const active=x.dataset.action===(screen==='mock'||screen==='mock-entry'?'mock-entry':screen==='study'?'review':'course');x.classList.toggle('primary',active);x.setAttribute('aria-current',active?'page':'false');});root.innerHTML=screen==='course'?courseMarkup():screen==='units'?unitsMarkup():screen==='goals'?goalsMarkup():screen==='study'?studyMarkup():screen==='mock'?mockMarkup():screen==='practice'?`<h1>Luyện câu gốc</h1><p class="note">Lượt luyện này không lưu tiến độ hoặc lịch ôn.</p>${questionMarkup(view,Boolean(view.feedback))}${feedbackMarkup(view.feedback)}${actions(view.feedback?B('Câu tiếp theo','practice-next',true):B('Trả lời','practice-answer',true,selection===null),B('Về khóa học','course'))}`:screen==='mock-entry'?`<h1>Thi thử</h1><p>30 câu · 20 phút · cần 27 câu đúng và không sai hoặc bỏ trống câu điểm liệt.</p><div class="inline-teaching"><h3>Luyện đề ngẫu nhiên từ ngân hàng</h3><p>Bộ đề thi riêng chưa được cung cấp. Kết quả sẽ do máy chủ chấm khi nộp hoặc hết giờ.</p></div>${actions(B('Bắt đầu 20 phút','mock-start',true,!savedAvailable()),B('Về khóa học','course'))}`:'';root.setAttribute('aria-busy',String(busy));if(busy)setBusy();if(retryTask)renderRetry();updateTimer();}
async function loadUnits(){return call('list_units',{kind:unitKind,query:search,offset:page*25,limit:25});}
function sessionArgs(){return {sessionId:view.sessionId,questionId:qid(question())};}
function mockArgs(){return {attemptId:view.attemptId};}
async function help(){const ctx={...sessionArgs(),selectedAnswer:selection,helpKind:view.currentFeedback?'explanation':'hint'};await call('request_study_help',ctx,true,async()=>{if(!capabilities.message){notice('Máy chủ đã ghi nhận hỗ trợ. Host này không gửi được yêu cầu vào ChatGPT; hãy hỏi trong cuộc trò chuyện.',true);return;}await rpc('ui/message',{role:'user',content:[{type:'text',text:`Hãy hướng dẫn tôi hiểu câu này, dựa trên nguồn đã duyệt. Ngữ cảnh: ${JSON.stringify({...ctx,question:question(),feedback:view.currentFeedback})}`} ]});notice('Đã gửi yêu cầu giải thích vào cuộc trò chuyện.');});}
root.addEventListener('submit',event=>{event.preventDefault();if(event.target.id==='unit-search'){search=document.querySelector('#search').value.trim();page=0;loadUnits();}if(event.target.id==='goal-form'){const choice=new FormData(event.target).get('goal');const n=choice==='custom'?Number(document.querySelector('#custom-goal').value):Number(choice);if(!Number.isInteger(n)||n<1||n>600){notice('Chọn số nguyên từ 1 đến 600.',true);return;}call('update_profile',{dailyGoal:n},true);}});
document.addEventListener('change',event=>{if(retryTask){notice('Thử lại yêu cầu chưa xác nhận trước khi thay đổi lựa chọn.',true);render();return;}if(event.target.name==='confidence'){confidence=event.target.value;return;}if(event.target.name!=='answer')return;selection=event.target.value;const q=question(),key=`${lastIdentity}:${qid(q)}`;drafts.set(key,selection);if(screen==='mock'){call('save_mock_choice',{...mockArgs(),questionId:qid(q),answer:selection},true,()=>{drafts.delete(key);render();});}else{document.querySelector('[data-action="answer"], [data-action="practice-answer"]')?.removeAttribute('disabled');}});
document.addEventListener('click',async event=>{const el=event.target.closest('[data-action]');if(!el||busy)return;if(retryTask){notice('Thử lại yêu cầu trước để kiểm tra lựa chọn đã lưu.',true);renderRetry();return;}const a=el.dataset.action,v=el.dataset.value;if(a==='close-zoom'){document.querySelector('#zoom').close();return;}if(a==='zoom'){const image=document.querySelector('#zoom img');image.src=v;image.alt='Hình minh họa câu hỏi gốc, phóng to';document.querySelector('#zoom').showModal();return;}if(a==='source'){if(capabilities.openLinks)rpc('ui/open-link',{url:v}).catch(e=>notice(e.message,true));else notice('Host không mở được liên kết nguồn.',true);return;}if(a==='mock-confirm'||a==='mock-leave'){const m=view,saved=m.answers||m.choices||{},n=(m.questions||[]).filter(q=>!saved[qid(q)]).length;if(!confirm(a==='mock-leave'?'Dừng bài thi? Những lựa chọn tạm sẽ không được chấm hoặc tính vào lịch sử học.':`${n} câu chưa trả lời. Nộp bài và chấm ngay?`))return;return call(a==='mock-leave'?'abandon_mock_test':'finalise_mock_test',{...mockArgs(),...(a==='mock-leave'?{}:{confirmUnanswered:true})},true);}if(['course','review','mock-entry','goals','categories','families','unit'].includes(a)&&screen==='mock'&&view.status==='active'){if(!confirm('Rời và dừng bài thi? Những lựa chọn tạm sẽ không được chấm.'))return;await call('abandon_mock_test',mockArgs(),true);if(retryTask)return;}if(a==='course')return call('get_course');if(a==='goals'){screen='goals';render();return;}if(a==='mock-entry'){screen='mock-entry';render();return;}if(a==='mock-start')return call('start_mock_test',{mode:'random'},true);if((a==='daily'||a==='review')&&!savedAvailable()){notice('Ôn tập cần lịch sử học đã lưu. Bạn vẫn có thể chọn một chủ đề để luyện câu gốc không lưu.',true);return;}
if(a==='daily'||a==='review')return call('start_study',a==='review'?{reviewOnly:true}:{},true);if(a==='categories'||a==='families'){unitKind=a==='families'?'family':'category';search='';page=0;return loadUnits();}if(a==='units-prev'||a==='units-next'){page+=a==='units-next'?1:-1;return loadUnits();}if(a==='unit'){if(savedAvailable())return call('start_study',{unitId:v,override:true},true);const unit=(units?.units||course?.units||[]).find(x=>x.id===v);return call('get_question',unit?.questionIds?.[0]?{questionId:unit.questionIds[0]}:{topic:v});}if(a==='answer'){const key=`${lastIdentity}:${qid(question())}`;return call('submit_study_answer',{...sessionArgs(),answer:selection,...(confidence?{confidence}:{})},true,()=>{drafts.delete(key);render();});}if(a==='study-next')return call('next_study_question',{sessionId:view.sessionId},true);if(a==='inspect-session')return call('get_study_session',{sessionId:v});if(a==='pause')return call('pause_study',{sessionId:view.sessionId},true);if(a==='resume')return call('resume_study',{sessionId:v||view.sessionId},true);if(a==='skip')return call('skip_study_question',sessionArgs(),true);if(a==='confusion'){const sessionId=view.sessionId;return call('set_question_confusion',{questionId:qid(question()),enabled:!(view.confusionEnabled||view.confused||question()?.confused)},true,async()=>accept(await rpc('tools/call',{name:'get_study_session',arguments:{sessionId}})));}if(a==='help')return help();if(a==='mock-nav'||a==='mock-prev'||a==='mock-next'){if(drafts.has(`${lastIdentity}:${qid(question())}`)){notice('Lựa chọn chưa lưu. Hãy thử lại trước khi chuyển câu.',true);return;}mockIndex=a==='mock-nav'?Number(v):mockIndex+(a==='mock-prev'?-1:1);render();return;}if(a==='practice-answer'){const q=view;return call('submit_answer',{questionId:qid(q),selectedAnswer:selection,attemptId:crypto.randomUUID()},false,data=>{view={...q,feedback:data};screen='practice';render();});}if(a==='practice-next'){selection=null;return call('get_question',{afterQuestionId:qid(view)});}});
function updateTimer(){if(screen!=='mock'||!view||view.status!=='active')return;const deadline=Number(view.deadline??view.deadlineAt),seconds=Math.max(0,Math.ceil((deadline-(Date.now()+clockOffset))/1000));const timer=document.querySelector('#timer');if(timer)timer.textContent=Number.isFinite(seconds)?`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`:'Đồng hồ chưa khả dụng';if(seconds===0&&!busy&&!retryTask)call('get_mock_test',mockArgs());}
