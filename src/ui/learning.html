function optionsMarkup(q,picked,locked=false,f=null){const opts=Array.isArray(q.options)?q.options:Object.entries(q.options||{}).map(([id,text])=>({id,text}));return `<fieldset class="opts${f?' judged':''}" ${locked?'disabled':''}><legend class="sr">${f?'Đáp án đã trả lời':'Chọn một đáp án'}</legend>${opts.map((o,i)=>{const k=choiceKey(o,i),right=Boolean(f)&&k===f.correctAnswer,wrong=Boolean(f)&&k===f.selectedAnswer&&!right,tag=wrong?'Bạn chọn':right&&!f.correct?'Đáp án đúng':'';return `<label class="opt ${right?`right ${f.correct&&!f.assisted?A('a-bounce'):''}`:wrong?`wrong ${A('a-shake')}`:f?'dim':''}"><input type="radio" name="answer" value="${E(k)}" ${picked===k?'checked':''}><span class="key mono" aria-hidden="true">${right?`<span class="${A('a-pop')}">${icon(CHECK,20,3)}</span>`:wrong?`<span class="x">${icon(CROSS,14,3.4)}</span>`:E(k)}</span><span class="sr">${E(k)}.</span><span class="txt">${E(o.text||o.label||o)}</span>${tag?`<span class="tag">${tag}</span>`:right?'<span class="sr">Đáp án đúng</span>':''}</label>`;}).join('')}</fieldset>`;}

function savedAvailable(c=course){return c?.historyAvailable!==false&&c?.persistence!=='unavailable';}
// A learner with no sessions, tests or answers sees the goal picker first (PRD 11).
function firstVisit(c){return savedAvailable(c)&&!c.sessions?.length&&!c.mocks?.length&&!c.results?.totalAttempts&&!c.covered;}
function localDate(at,opts){try{return new Intl.DateTimeFormat('vi-VN',{...opts,timeZone:course?.profile?.timezone||'Asia/Ho_Chi_Minh'}).format(at);}catch{return new Intl.DateTimeFormat('vi-VN',opts).format(at);}}

function dayWord(at){const now=Date.now()+clockOffset,key=t=>localDate(t,{year:'numeric',month:'2-digit',day:'2-digit'});return at<=now||key(at)===key(now)?'hôm nay':key(at)===key(now+86400000)?'ngày mai':`ngày ${localDate(at,{day:'numeric',month:'numeric'})}`;}
function learnWhen(at){if(!Number.isFinite(at))return 'Ôn lại khi đến hạn để thuộc.';return at<=Date.now()+clockOffset?'Có câu đã đến hạn: ôn ngay để thuộc.':`Sớm nhất từ <span class="mono">${E(localDate(at,{hour:'2-digit',minute:'2-digit',hourCycle:'h23'}))}</span> ${E(dayWord(at))} bạn ôn lại để thuộc.`;}

const INFO_ICON='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle class="info-ring" cx="12" cy="12" r="9.6"/><path class="info-i" d="M12 11v5.6"/><circle class="info-dot" cx="12" cy="7.6" r="1.5" fill="currentColor" stroke="none"/></svg>';

// Questions with one qualifying answer get their own line under Đã thuộc, never added to its number.
function numTiles(c,small=false,info=true){const n=(v,of)=>small?`<b class="mono">${E(v)}${of?`<small>/${E(of)}</small>`:''}</b>`:`<b class="mono">${E(v)}</b>${of?`<small class="mono">/${E(of)}</small>`:'<small>câu</small>'}`,label=(text,key,ctx)=>`<span>${text}</span>${info?infoButton(key,text,ctx):''}`;return `<div class="nums${small?' sm':''}"><div class="ntile">${n(c.covered,c.total)}${label('Đã gặp','covered')}</div><div class="ntile mid">${n(c.learned,c.total)}${label('Đã thuộc','learned',{onTheWay:c.onTheWay,nextLearnAt:c.nextLearnAt})}${c.onTheWay>0?`<small class="nwait"><span class="mono">+${E(c.onTheWay)}</span> đang chờ ôn lại</small>`:''}</div><div class="ntile inv">${n(c.due)}${label('Cần ôn hôm nay','due')}</div></div>`;}
function signinMarkup(){return `<div class="signin"><h2>Đăng nhập để lưu tiến độ</h2><p class="lead">Bạn vẫn có thể luyện câu gốc, nhưng kết quả chưa được lưu.</p><p class="note">Khi bạn muốn lưu, ChatGPT sẽ hỏi kết nối tài khoản trong khung chat.</p></div>`;}
// Home card (PRD 8): the goal ring, the three numbers, the league line, the forecast and one "Học tiếp".
function homeMarkup(){const c=course||{},date=localDate(c.serverNow??Date.now(),{weekday:'long',day:'numeric',month:'numeric'});if(!savedAvailable(c))return `<div class="lesson">${lxHead(E(date))}${signinMarkup()}<button class="btn press" data-action="map">Chọn chủ đề để luyện</button></div>`;const league=c.leagueSummary,running=(c.mocks||[]).some(m=>m.status==='active'),finish=c.covered>=c.total?'Bạn đã gặp đủ 600 câu.':c.forecastFinishAt?`Theo nhịp ${E(c.dailyGoal)} câu/ngày: xong lượt đầu ngày ${E(localDate(c.forecastFinishAt,{day:'numeric',month:'numeric'}))}`:'';return `<div class="lesson">${lxHead(E(date))}${goalPanel({newToday:c.newToday,dailyGoal:c.dailyGoal,dueCount:c.dueCount},c.dueCount?`Còn ${E(c.dueCount)} câu ôn — làm trước`:'Đã ôn xong hôm nay')}${numTiles({covered:c.covered,learned:c.learned,onTheWay:c.onTheWay,nextLearnAt:c.nextLearnAt,total:c.total,due:c.dueCount})}${league?.joined?`<button class="row-btn press" data-action="league"><span class="rank mono" aria-hidden="true">${E(league.rank??'–')}</span><span class="row-text"><b>Tuần này: <span class="mono">${E(league.weekXp)} XP</span></b><small>${league.rank?`Hạng ${E(league.rank)} trong nhóm`:'Chưa xếp hạng tuần này'} · Xem bảng</small></span>${icon(CHEVRON,18,2.4)}</button>`:league?`<button class="invite-row press" data-action="league"><span class="row-text"><b>Tham gia nhóm thi đua tuần</b>${league.weekXp?`<small>Tuần này bạn có <span class="mono">${E(league.weekXp)} XP</span></small>`:''}</span>${icon(CHEVRON,18,2.4)}</button>`:''}${finish?`<p class="forecast-line">${finish}</p>`:''}${running?'<p class="note">Bạn còn một bài thi thử chưa nộp. <button class="more" data-action="mock-start">Làm tiếp bài thi</button></p>':''}<button class="btn press" data-action="daily">Học tiếp</button><div class="sub-actions"><button class="btn2 press" data-action="map">${icon(GRID,18,2)}Chọn chủ đề</button><button class="btn2 press" data-action="mock-entry">${icon(STOPWATCH,18,2.2)}Thi thử</button></div><div class="quiet-row">${c.covered?'<button class="tertiary" data-action="lightning">Chớp nhoáng 60 giây</button>':''}<button class="tertiary" data-action="goals">Đổi mục tiêu</button></div></div>`;}
// Goal picker (PRD 11, A2a): study days use the server's arithmetic, remaining questions over the goal within 60 days.
function goalDays(goal){return Math.ceil(Math.max(0,600-(course?.covered??0))/goal);}
function goalLines(goal){const d=goalDays(goal);return d<=60?[`${d} ngày học`,d===60?'xong trong 60 ngày':`dư ${60-d} ngày`]:[`${d} ngày học`,'quá 60 ngày'];}
function goalForecast(goal){if(!goal)return {label:'—',cells:[...Array(60)].map(()=>''),text:'Chọn một mức để xem dự báo.',over:false};const d=goalDays(goal),left=600-(course?.covered??0);return {label:`${d} ngày học`,cells:[...Array(60)].map((_,i)=>i<Math.min(d,60)?(d>60?'over':'on'):''),text:d<=60?`Xong lượt đầu ${left===600?'600 câu':`${left} câu còn lại`} sau ${d} ngày học, còn ${60-d} ngày dự phòng.`:`${d} ngày — quá 60 ngày. Bạn vẫn có thể giữ mức này.`,over:d>60};}
function goalValue(){return goalPick==='custom'?goalCustom:goalPick;}
function goalsMarkup(){const first=goalFrom==='first',f=goalForecast(goalValue());return `<form id="goal-form" class="goal-form" novalidate>${lxHead(first?'Bước 1/2':'Mục tiêu')}<h2 class="goal-q" tabindex="-1" data-focus>Mỗi ngày bạn muốn học bao nhiêu câu mới?</h2><fieldset class="goal-grid"><legend class="sr">Số câu mới mỗi ngày</legend>${[10,12,15].map(n=>{const [a,b]=goalLines(n);return `<label class="gtile press">${n===12?'<span class="rec">ĐỀ XUẤT</span>':''}<input type="radio" name="goal" value="${n}" ${goalPick===n?'checked':''}><span class="n mono">${n}</span><b>câu/ngày</b><small>${a}</small><small>${b}</small></label>`;}).join('')}</fieldset><div class="ctile"><label><input type="radio" name="goal" value="custom" ${goalPick==='custom'?'checked':''}><b>Tự chọn</b><small>Số câu bất kỳ, xem số ngày ngay</small></label><div class="stepper"><button type="button" class="press" data-action="goal-dec" aria-label="Giảm một câu">−</button><label class="sr" for="custom-goal">Số câu mới mỗi ngày (1–600)</label><input id="custom-goal" class="mono" type="number" inputmode="numeric" min="1" max="600" value="${E(goalCustom)}"><button type="button" class="press" data-action="goal-inc" aria-label="Tăng một câu">+</button></div></div><div class="fc"><div class="fc-head"><span class="eyebrow">Dự báo 60 ngày</span><span class="mono" id="fc-label">${f.label}</span></div><div class="cells" aria-hidden="true">${f.cells.map((k,i)=>`<i class="${k}" style="animation-delay:${(i*.008).toFixed(3)}s"></i>`).join('')}</div><div class="fc-ends mono" aria-hidden="true"><span>Ngày 1</span><span>Ngày 60</span></div><p class="fc-text${f.over?' over':''}" id="fc-text" aria-live="polite">${f.text}</p></div><p class="note">Câu ôn tập được tính riêng và luôn làm trước.</p><button class="btn press" type="submit" ${goalValue()?'':'disabled'}>${first?'Bắt đầu':'Lưu mục tiêu'}</button>${first?'':'<button class="tertiary" type="button" data-action="course">Quay lại</button>'}</form>`;}
// Updates the forecast in place so typing a custom goal keeps the field's focus.
function updateGoal(){const f=goalForecast(goalValue());const label=document.querySelector('#fc-label'),text=document.querySelector('#fc-text');if(label)label.textContent=f.label;if(text){text.textContent=f.text;text.classList.toggle('over',f.over);}document.querySelectorAll('.cells i').forEach((cell,i)=>{cell.className=f.cells[i];});const submit=document.querySelector('#goal-form [type="submit"]');if(submit)submit.disabled=!goalValue();}
function goalSavedMarkup(){const c=course||{},saved=savedAvailable(c);return `<div class="lesson">${lxHead('Bước 2/2')}<div class="step2 ${A('a-rise')}"><div class="bigicon goalbox ${A('a-pop')}"><span class="mono">${E(c.dailyGoal)}</span><small>câu/ngày</small></div><h2 class="title" tabindex="-1" data-focus>${saved?'Tiến độ của bạn được lưu':'Tiến độ chưa được lưu'}</h2><p class="lead">${saved?c.persistence==='authenticated'?'Tài khoản đã kết nối, nên lịch ôn và kết quả được giữ qua mọi cuộc trò chuyện.':'Lịch ôn và kết quả được lưu trên máy chủ, kể cả khi bạn tải lại thẻ.':'Kết nối này chưa lưu lịch sử học. Khi bạn muốn lưu, ChatGPT sẽ hỏi kết nối tài khoản.'}</p>${saved?'<button class="btn press" data-action="daily">Học bài đầu</button>':'<button class="btn press" data-action="map">Chọn chủ đề để luyện</button>'}<button class="tertiary" data-action="goals">Đổi mục tiêu</button></div></div>`;}
// Course map (ui-ux 4.10): seven bank categories in chapter order, then the confusing-question category.
function mapUnits(){const c=course||{},x=c.customCategory;return [...(c.units||[]).map(u=>({id:u.id,title:SHORT[u.id]??u.title,total:u.questionCount,covered:u.covered,learned:u.learned,onTheWay:u.onTheWay,due:u.due,firstQuestionId:u.firstQuestionId})),...(x?[{id:x.id,title:SHORT[x.id]??x.title,total:x.total,covered:x.covered,learned:x.learned,onTheWay:x.onTheWay,due:x.due??0,families:x.familyCount,custom:true}]:[])];}

function mapMarkup(){const c=course||{},units=mapUnits(),next=mapNext(units),saved=savedAvailable(c),u=mapSel===null?null:units[mapSel];return `<div class="lesson"><header class="map-head"><button class="icon-btn" data-action="course" aria-label="Về trang chính">${icon(CROSS)}</button><div><h1 class="map-title" tabindex="-1" ${u?'':'data-focus'}>Khóa học bằng B</h1><p class="sub">7 chủ đề + Câu hỏi dễ nhầm lẫn</p></div></header>${saved?numTiles({covered:c.covered,learned:c.learned,onTheWay:c.onTheWay,nextLearnAt:c.nextLearnAt,total:c.total,due:c.dueCount},true):''}<ol class="path" aria-label="Chủ đề">${units.map((x,i)=>{const pct=x.total?Math.round(x.covered/x.total*100):0,shape=x.custom?'custom':x.id==='diem_liet'?'priority':'',fresh=!saved||!x.covered;return `<li class="node-wrap" style="--k:${OFFSETS[i]??0}">${i===next&&saved?`<span class="bubble" aria-hidden="true">${x.covered?'Học tiếp':'Bắt đầu'}</span>`:''}<span class="node-box"><button class="node press ${shape}${fresh?' new':''}" data-action="map-node" data-value="${i}" aria-pressed="${mapSel===i}" aria-label="${E(x.title)}${saved?`, đã gặp ${E(x.covered)} trên ${E(x.total)}${x.due?`, ${E(x.due)} câu cần ôn hôm nay`:''}`:''}"><span class="fill" style="height:${saved?pct:0}%"></span><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${GLYPH[x.id]??PAIR}"/></svg></button>${saved&&x.due?`<span class="badge mono" aria-hidden="true">${E(x.due)}</span>`:''}</span><span class="node-label" aria-hidden="true">${E(x.title)}</span>${saved?`<span class="node-count mono" aria-hidden="true">${x.custom?`${E(x.families)} nhóm · `:''}${E(x.covered)}/${E(x.total)}</span>`:''}</li>`;}).join('')}</ol>${u?sheetMarkup(u,c,saved):''}</div>`;}

press"><input type="radio" name="family" value="${E(x.id)}" ${picked(x,'row')?'checked':''}><span class="radio" aria-hidden="true"></span><span class="fam-text"><b>${E(x.title)}</b><small class="mono">${E(x.questionCount)} câu${x.requiresVisualReview?` ${icon(IMG,12,2.2)}<span class="sr">, có hình</span>`:''}</small></span>${famTag(x)}</label>${picked(x,'row')?cta:''}`).join('')}</fieldset>`:'<p class="empty">Không tìm thấy nhóm nào. Thử không dấu hoặc số câu.</p>'}${page>0||more?`<div class="pager"><button class="tertiary" data-action="units-prev" ${page===0?'disabled':''}>Trang trước</button><button class="tertiary" data-action="units-next" ${more?'':'disabled'}>Trang tiếp</button></div>`:''}${famSel&&!shown?`<div class="cta-bar"><button class="btn press" data-action="unit" data-value="${E(famSel)}">Học nhóm này</button></div>`:''}</div>`;}

// Lesson sub-screens are derived from the study view: nothing answered yet opens the intro, a complete session finishes.
const lessonScreens={intro:introMarkup,step:stepMarkup,pair:pairMarkup,paused:pausedMarkup,finish:finishMarkup,ltrun:ltRunMarkup,ltover:ltOverMarkup};
function lessonScreen(){const v=view;if(v.mode==='lightning')return v.status==='complete'||v.remainingMs===0||v.review?'ltover':'ltrun';if(step.phase==='skipped')return 'step';if(v.status==='complete')return 'finish';if(v.status==='paused'&&!v.question&&v.skippedPending>0)return 'finish';if(v.status==='paused'||!v.question)return 'paused';if(!v.completed&&!v.sessionResults?.answered&&!marked('started:'+v.sessionId))return 'intro';return v.pair?'pair':'step';}
function studyMarkup(){return `<div class="lesson">${lessonScreens[lessonScreen()]()}</div>`;}
function progress(){const v=view,current=step.phase==='skipped'?null:v.question?.id,results=new Map((v.sessionResults?.items||[]).map(r=>[r.questionId,r.correct])),done=[],rest=[];let here='';for(const i of v.queue||[]){if(i.status==='answered')done.push(results.get(i.questionId)===false?'wrong':'done');else if(i.questionId===current&&!here&&!v.currentFeedback)here='current';else rest.push(i.skipped?'skipped':'');}return {segs:[...done,...(here?[here]:[]),...rest],pos:done.length+(here?1:0)};}
function topBar(intro=false){const v=view,{segs,pos}=intro?{segs:(v.queue||[]).map(()=>''),pos:0}:progress();return `<div class="topbar"><button class="icon-btn" data-action="pause" aria-label="Tạm dừng và lưu">${icon(CROSS)}</button><div class="segs" role="progressbar" aria-label="Tiến độ bài học" aria-valuemin="0" aria-valuemax="${E(v.total)}" aria-valuenow="${pos}">${segs.map(c=>`<span class="seg ${c}"></span>`).join('')}</div><span class="pos mono">${pos}/${E(v.total)}</span></div>`;}
// The step map: ○ per review, ■ per new question, □ per practice question and ◆ per compare-the-pair challenge.
function introMarkup(){const v=view,st=v.steps||{review:0,new:0,practice:0,pairGroups:0},review=st.review,fresh=st.new,practice=st.practice,pairs=st.pairGroups,minutes=(v.estimatedMinutes?.review??0)+(v.estimatedMinutes?.new??0);const due=v.pendingDue?` ${v.pendingDue} câu đến hạn vẫn chờ ôn.`:'',count=(v.queue||[]).length;const [title,lead]=v.unit?[SHORT[v.unit.id]??v.unit.title,`${count} câu ${v.unit.family?'trong nhóm dễ nhầm này':'trong chủ đề này'}.${due}`]:marked('mock-review:'+v.sessionId)?['Ôn các câu sai',`${count} câu sai hoặc bỏ trống trong bài thi thử.${due}`]:v.override?['Luyện theo lựa chọn',`${count} câu bạn chọn.${due}`]:!fresh?['Ôn tập đến hạn',`Hôm nay ôn ${review}${v.pendingDue>review?`/${v.pendingDue}`:''} câu đến hạn.`]:review?['Ôn lại rồi học câu mới',`Ôn lại ${review} câu trước, sau đó học ${fresh} câu mới.`]:['Học câu mới',`${fresh} câu mới theo mục tiêu hôm nay.`];const shapes=[...Array(review).fill('review'),...Array(fresh).fill('new'),...Array(practice).fill('practice'),...Array(pairs).fill('pair')];const stats=[[review,'câu ôn'],[fresh,'câu mới'],[practice,'luyện lại'],[pairs,'thử thách']].filter(([n])=>n>0);return `${topBar(true)}<div class="intro-head"><span class="chip step">BÀI HÔM NAY</span><h2 class="title" tabindex="-1" data-focus>${title}</h2><p class="lead">${E(lead)}</p></div><div class="map"><div class="shapes" aria-hidden="true">${shapes.map((k,n)=>`<span class="shape ${k} ${A('a-pop')}" style="animation-delay:${(n*.04).toFixed(2)}s"></span>`).join('')}</div><div class="stats">${stats.map(([n,label])=>`<div class="stat"><b class="mono">${n}</b><span>${label}</span></div>`).join('')}</div><div class="legend">${review?'<span><i class="shape review"></i>Ôn lại</span>':''}${fresh?'<span><i class="shape new"></i>Mới</span>':''}${practice?'<span><i class="shape practice"></i>Luyện lại</span>':''}${pairs?'<span><i class="shape pair"></i>Thử thách</span>':''}${minutes?`<span class="time mono">~${minutes} phút</span>`:''}</div></div><button class="btn press" data-action="lesson-start">Bắt đầu</button>`;}
function chipsMarkup(q,label){const kind=label??(view.repairOf?'THỬ LẠI':{review:'ÔN LẠI',new:'MỚI',practice:'LUYỆN LẠI'}[view.itemKind]),combo=view.mode==='lesson'&&view.combo>=3&&!['feedback','skipped'].includes(step.phase);return `<div class="chips">${kind?`<span class="chip step">${kind}</span>${kind==='THỬ LẠI'?infoButton('repair','Thử lại'):''}`:''}<span class="chip num mono">Câu ${E(qnum(q))}</span>${q.critical?'<span class="chip num">Điểm liệt</span>':''}${view.confusionEnabled&&step.phase!=='skipped'?`<span class="chip flag ${popFlag?'a-pop':''}">Đang phân vân</span>`:''}${combo?`<span class="combo-pill mono" aria-label="${E(view.combo)} câu đúng liên tiếp">${solid(BOLT,14)}×${E(view.combo)}</span>`:''}</div>`;}
function stepMarkup(){const v=view,ph=step.phase,q=ph==='skipped'?step.question:v.question,f=ph==='feedback'?v.currentFeedback:null,open=ph==='idle'||ph==='selected';return `${topBar()}${chipsMarkup(q,ph==='skipped'?step.kind:undefined)}${v.repairOf&&ph!=='skipped'?'<p class="repair-line">Bạn đã sai câu này lúc nãy</p>':''}<h2 class="stem" tabindex="-1" ${open?'data-focus':''}>${E(q.question)}</h2>${imageMarkup(q)}${optionsMarkup(q,f?f.selectedAnswer:ph==='skipped'?null:step.selection,!open,f)}${f?verdictMarkup(f,q):ph==='failed'?failedMarkup():ph==='skipped'?skippedMarkup():actionMarkup()}`;}
function actionMarkup(){return `<div class="act"><div class="act-row"><button class="chip-btn" data-action="guess" aria-pressed="${step.guess}">Tôi đoán</button>${infoButton('guess','Tôi đoán')}<button class="link-btn" data-action="skip">Bỏ qua</button></div><button class="btn press" data-action="answer" ${step.selection===null?'disabled':''}>Kiểm tra</button></div>`;}
// XP, combo and "Đã thuộc!" come from the server's award for this answer; the card never computes them.
function verdictMarkup(f,q){const v=view,repair=Boolean(v.repairOf),award=v.lastAward,variant=!f.correct?'miss':f.assisted&&!repair?'soft':'win',head=!f.correct?'Chưa đúng':repair?'Đã sửa!':f.assisted?'Đúng (có hỗ trợ)':f.confidence==='guess'?'Đúng — lần sau thử không đoán nhé':'Chính xác!',answer=(q.options||[]).find(o=>o.id===f.correctAnswer),gap=v.help?.explanation===null||f.teachingStatus==='teaching_gap',deep=!f.correct&&repair;
  return `<section class="panel ${variant} ${A('a-rise')}" aria-labelledby="verdict">${variant==='miss'?'<div class="edge"></div>':''}<div class="panel-body"><div class="verdict-row"><div class="vicon">${variant==='miss'?`<span class="vbox ${A('a-shake')}">${icon(CROSS,20,3.2)}</span>`:`<span class="vbox ${variant==='win'?A('a-pop'):''}">${icon(CHECK,variant==='win'?26:24,variant==='win'?3:2.6)}</span>${variant==='win'&&animate?SPARKS:''}`}</div><h3 class="vhead" id="verdict" tabindex="-1" data-focus>${head}</h3>${award?.baseXp>0?`<span class="xp mono">+${E(award.baseXp)} XP${animate?`<span class="xp-float" aria-hidden="true">+${E(award.baseXp)}</span>`:''}</span>`:''}</div>${f.correct&&v.mode==='lesson'&&v.combo>=3?`<p class="combo ${A('a-pop')}">${solid(BOLT,16)}Combo ${E(v.combo)} câu liên tiếp${infoButton('combo','Combo')}</p>`:''}${award?.masteredNow?`<p class="mastered ${A('a-pop')}">Đã thuộc! <span class="mono">+${E(award.bonusXp)} XP</span></p>`:''}${f.correct?'':`<p class="right-line">Đáp án đúng: ${E(f.correctAnswer)}${answer?` · ${E(answer.text)}`:''}</p>`}<div class="why-wrap"><p class="why${step.expanded||gap?'':' clamp'}" id="why">${gap?'Chưa có giải thích được duyệt cho câu này.':E(f.explanation)}</p>${gap?'':`<button class="more" data-action="why" aria-expanded="${step.expanded}" aria-controls="why">${step.expanded?'Thu gọn':'Xem thêm'}</button>`}</div>${deep?`<button class="deep" data-action="deep-help">${icon(CHAT,16,2.2)}ChatGPT có thể giải thích kỹ hơn</button>`:gap?`<button class="deep" data-action="help">${icon(CHAT,16,2.2)}Hỏi ChatGPT</button>`:''}<button class="btn press" data-action="study-next">Tiếp tục</button></div></section>${helpersMarkup(gap&&!deep)}`;}
function helpersMarkup(helpInPanel=false){const video=(view.teaching?.videos||[]).find(x=>x?.verified===true&&safeImage(x.url));return `<div class="helpers">${helpInPanel?'':`<button class="tile press" data-action="help">${icon(CHAT,16,2.2)}Hỏi ChatGPT</button>`}<button class="tile press" data-action="confusion" aria-pressed="${Boolean(view.confusionEnabled)}">${icon(FLAG,16,2.2)}Tôi còn phân vân</button>${video?`<button class="tile press" data-action="source" data-value="${E(video.url)}" aria-label="Video, mở YouTube"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="${PLAY}"/></svg>Video</button>`:''}</div>`;}

// Today's goal ring: one segment per new question in the goal (at most 30 drawn), with a check once due reviews are done.
function ring(done,goal,check,size=88){const n=Math.max(1,Math.min(goal,30)),on=Math.round(Math.min(done,goal)/goal*n),c=size/2,r=c-7,gap=n>1?Math.min(8,90/n):0,pt=a=>`${(c+r*Math.cos(a*Math.PI/180)).toFixed(2)} ${(c+r*Math.sin(a*Math.PI/180)).toFixed(2)}`;let segs='';for(let i=0;i<n;i++){const a0=-90+i*360/n+gap/2,a1=-90+(i+1)*360/n-gap/2;segs+=n===1?`<circle class="seg${on?' on':''}" cx="${c}" cy="${c}" r="${r}"/>`:`<path class="seg${i<on?` on ${A('a-seg')}`:''}" style="animation-delay:${(i*.05).toFixed(2)}s" d="M${pt(a0)}A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${pt(a1)}"/>`;}return `<div class="ring" role="img" aria-label="${E(done)} trên ${E(goal)} câu mới hôm nay${check?', đã ôn xong':''}"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">${segs}</svg><span class="ring-num mono" aria-hidden="true"><span>${E(Math.min(done,goal))}<small>/${E(goal)}</small></span></span>${check?`<span class="ring-check" aria-hidden="true">${icon(CHECK,14,3.2)}</span>`:''}</div>`;}

ustom')goalCustom=course?.dailyGoal??goalCustom;screen='goals';render();focusStep();return;}if(a==='goal-dec'||a==='goal-inc'){goalCustom=Math.min(600,Math.max(1,goalCustom+(a==='goal-inc'?1:-1)));goalPick='custom';const field=document.querySelector('#custom-goal');if(field)field.value=goalCustom;updateGoal();return;}if(a==='map'||a==='categories'){if(!course)return call('get_course',{},false,()=>{screen='map';render();},true,nav);screen='map';render();focusStep();return;}if(a==='map-node'){mapSel=mapSel===Number(v)?null:Number(v);render();focusStep();return;}if(a==='map-close'){const was=mapSel;mapSel=null;render();root.querySelector(`[data-action="map-node"][data-value="${was}"]`)?.focus();return;}if(a==='league')return call('get_league',{},false,null,false,nav);if(a==='league-hide')return call('set_league_hidden',{hidden:v==='true'},true);if(a==='league-leave'){leagueConfirm=true;render();focusStep();return;}if(a==='league-stay'){leagueConfirm=false;render();root.querySelector('[data-action="league-leave"]')?.focus();return;}if(a==='league-leave-yes'){leagueConfirm=false;return call('leave_league',{},true,()=>notice('Bạn đã rời nhóm thi đua tuần.'));}if(a==='mock-entry'){screen='mock-entry';render();return;}if(a==='mock-start')return call('start_mock_test',{mode:'random'},true);if(a==='mock-review'){const ids=(view.results||[]).filter(x=>x.unanswered||x.correct===false).map(x=>x.questionId);return call('start_study',{questionIds:ids,count:ids.length},true,data=>{if(!data?.sessionId)return;mark('mock-review:'+data.sessionId);render();});}if((a==='daily'||a==='review')&&!savedAvailable()){notice('Học tiếp cần lưu tiến độ. Bạn vẫn có thể chọn một chủ đề để luyện câu gốc.',true);return;}
if(a==='daily'||a==='review')return call('start_study',a==='review'?{reviewOnly:true}:{},true,data=>{if(data?.nothingToStudy)notice(a==='review'?'Không có câu nào đến hạn ôn lúc này. Chọn một chủ đề để luyện thêm.':'Hôm nay không còn câu đến hạn ôn và bạn đã đạt mục tiêu câu mới. Chọn một chủ đề để luyện thêm.');},false,nav);if(a==='families'){search='';page=0;famSel=null;return loadUnits(nav);}if(a==='units-prev'||a==='units-next'){page+=a==='units-next'?1:-1;return loadUnits();}if(a==='unit'){if(savedAvailable())return call('start_study',{unitId:v,override:true},true);const unit=(course?.units||[]).find(x=>x.id===v);return call('get_question',unit?.firstQuestionId?{questionId:unit.firstQuestionId}:{topic:v});}
if(a==='answer'){step.phase='submitting';await call('submit_study_answer',{...sessionArgs(),answer:step.selection,...(step.guess?{confidence:'guess'}:{})},true,null,false,{onError:resync});if(retryTask?.request?.name==='submit_study_answer')step.phase='failed';else if(step.phase==='submitting')step.phase=step.selection===null?'idle':'selected';render();focusStep();return;}if(a==='study-next'){if(step.phase==='skipped'){step=idleStep();render();}else await call('next_study_question',{sessionId:view.sessionId},true,null,false,{onError:resync});focusStep();return;}if(a==='skip'&&view.pair){pairChoices=new Map();await call('skip_study_question',sessionArgs(),true,null,false,{onError:resync});focusStep();return;}if(a==='skip'){const q=view.question;const kind=view.repairOf?'THỬ LẠI':{review:'ÔN LẠI',new:'MỚI',practice:'LUYỆN LẠI'}[view.itemKind];await call('skip_study_question',sessionArgs(),true,()=>{step={...idleStep(),phase:'skipped',question:q,kind};render();},false,{onError:resync});focusStep();return;}if(a==='inspect-session')return call('get_study_session',{sessionId:v});if(a==='pause'){await call('pause_study',{sessionId:view.sessionId},true,null,false,nav);focusStep();return;}if(a==='resume'){await call('resume_study',{sessionId:v||view.sessionId},true,null,false,nav);focusStep();return;}if(a==='confusion'){const sessionId=view.sessionId;await call('set_question_confusion',{questionId:qid(question()),enabled:!view.confusionEnabled},true,async()=>accept(await tool('get_study_session',{sessionId})),true);root.querySelector('[data-action="confusion"]')?.focus({preventScroll:true});return;}if(a==='help'){await help();root.querySelector('[data-action="help"]')?.focus({preventScroll:true});return;}
if(a==='mock-nav'||a==='mock-prev'||a==='mock-next'){mockIndex=a==='mock-nav'?Number(v):mockIndex+(a==='mock-prev'?-1:1);render();return;}if(a==='practice-answer'){const q=view;return call('submit_answer',{questionId:qid(q),selectedAnswer:step.selection,attemptId:crypto.randomUUID()},false,data=>{view={...q,feedback:data};screen='practice';render();});}if(a==='practice-next')return call('get_question',{afterQuestionId:qid(view)});});
function updateTimer(){if(screen!=='mock'||!view||view.status!=='active')return;const deadline=Number(view.deadline??view.deadlineAt),seconds=Math.max(0,Math.ceil((deadline-(Date.now()+clockOffset))/1000));const timer=document.querySelector('#timer');if(timer)timer.textContent=Number.isFinite(seconds)?`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`:'Đồng hồ chưa khả dụng';const bar=document.querySelector('#mt-bar');if(bar&&Number.isFinite(seconds))bar.style.width=`${(seconds/12).toFixed(1)}%`;if(seconds===0&&!busy&&!retryTask)call('get_mock_test',mockArgs());}
const timerInterval=setInterval(updateTimer,1000),ltInterval=setInterval(ltTick,250);
// A second tap on the same ⓘ closes it; a tap anywhere else outside the popover closes it too.
document.addEventListener('click',event=>{const btn=event.target.closest?.('.info-btn');if(btn){if(btn===infoAnchor)closeInfo();else openInfo(btn,event.detail===0);return;}if(infoAnchor&&!infoPop.contains(event.target))closeInfo();});window.addEventListener('resize',placeInfo);
// Esc closes the popover first. Tab leaves it through its button: Tab goes on to the next control, Shift+Tab stops on the button.
document.addEventListener('keydown',event=>{if(infoAnchor&&event.key==='Escape'){event.preventDefault();closeInfo(true);return;}if(infoAnchor&&event.key==='Tab'&&infoPop.contains(document.activeElement)){if(event.shiftKey)event.preventDefault();closeInfo(true);return;}if(event.key==='Escape'&&confirmState){confirmState=null;render();focusStep();return;}if(event.key==='Escape'&&leagueConfirm){leagueConfirm=false;render();return;}if(event.key!=='Enter'||event.target.closest?.('button'))return;if(screen==='study'&&view?.mode==='lightning'&&lessonScreen()==='ltrun'&&step.selection!==null){event.preventDefault();ltCheck();}});
new ResizeObserver(()=>{if(hostOrigin!==null)notify('ui/notifications/size-changed',{height:Math.ceil(document.querySelector('main').getBoundingClientRect().height)});}).observe(document.body);
// The opening tool result may be stale after a reload, so a study or mock view is fetched again before it renders.
async function openWith(result){let data=null;try{data=unpack(result);}catch{accept(result);return;}data=data?.view||data;try{if(data?.kind==='study'&&data.sessionId){accept(await tool('get_study_session',{sessionId:data.sessionId}));return;}if(data?.kind==='mock'&&data.attemptId){const fresh=unpack(await tool('get_mock_test',{attemptId:data.attemptId}));accept({structuredContent:{...fresh,resumed:Boolean(data.resumed||fresh.resumed)}});return;}}catch{}accept(result);}
async function boot(){retryTask=null;let failed=null;try{course=unpack(await tool('get_course'));}catch(e){failed=e;}initialCapture=false;const openaiOutput=window.openai?.toolOutput;if(!initialResult&&openaiOutput&&typeof openaiOutput==='object'){initialResult={structuredContent:openaiOutput};openingSeen=true;}const opening=initialResult;initialResult=null;if(opening)return openWith(opening);if(failed){screen='loadfail';retryTask=boot;notice('');render();return;}accept({structuredContent:course});}
async function initialize(){try{const result=await rpc('ui/initialize',{appInfo:{name:'ly-thuyet-lai-xe',version:'1.0.0'},appCapabilities:{},protocolVersion:'2026-01-26'},10000);capabilities=result.hostCapabilities||{};applyTheme(result.hostContext?.theme);notify('ui/notifications/initialized',{});}catch{screen='offline';render();return;}if(!capabilities.serverTools){screen='offline';render();return;}await boot();}
// A card left open while another chat continued the lesson checks the server when it regains focus and never keeps stale controls.
function refreshStale(){if(document.visibilityState==='hidden'||busy||retryTask||screen!=='study'||!view?.sessionId||!capabilities.serverTools)return;const id=view.sessionId,before=`${view.status}|${qid(question())}|${view.completed}`;tool('get_study_session',{sessionId:id}).then(r=>{const d=unpack(r);if(screen!=='study'||view?.sessionId!==id||busy||Number(d.revision)<=revision)return;accept(r);if(`${d.status}|${d.question?.id}|${d.completed}`!==before)notice('Bài học đã tiếp tục ở nơi khác — thẻ đã cập nhật.');}).catch(()=>{});}
window.addEventListener('focus',refreshStale);document.addEventListener('visibilitychange',refreshStale);
initialize();
