function introMarkup(){const v=view,queue=v.queue||[],count=kind=>queue.filter(i=>i.kind===kind).length,review=count('review'),fresh=count('new'),practice=count('practice'),minutes=(v.estimatedMinutes?.review??0)+(v.estimatedMinutes?.new??0);const [title,lead]=v.override?['Luyện theo lựa chọn',`${queue.length} câu bạn chọn.${v.pendingDue?` ${v.pendingDue} câu đến hạn vẫn chờ ôn.`:''}`]:!fresh?['Ôn tập đến hạn',`Hôm nay ôn ${review}${v.pendingDue>review?`/${v.pendingDue}`:''} câu đến hạn.`]:review?['Ôn lại rồi học câu mới',`Ôn lại ${review} câu trước, sau đó học ${fresh} câu mới.`]:['Học câu mới',`${fresh} câu mới theo mục tiêu hôm nay.`];const stats=[[review,'câu ôn'],[fresh,'câu mới'],...(practice?[[practice,'câu luyện lại']]:[])];return `${topBar(true)}<div class="intro-head"><span class="chip step">BÀI HÔM NAY</span><h2 class="title" tabindex="-1" data-focus>${title}</h2><p class="lead">${E(lead)}</p></div><div class="map"><div class="shapes" aria-hidden="true">${queue.map((i,n)=>`<span class="shape ${i.kind} ${A('a-pop')}" style="animation-delay:${(n*.04).toFixed(2)}s"></span>`).join('')}</div><div class="stats">${stats.map(([n,label])=>`<div class="stat"><b class="mono">${n}</b><span>${label}</span></div>`).join('')}</div><div class="legend">${review?'<span><i class="shape review"></i>Ôn lại</span>':''}${fresh?'<span><i class="shape new"></i>Mới</span>':''}${practice?'<span><i class="shape practice"></i>Luyện lại</span>':''}${minutes?`<span class="time mono">~${minutes} phút</span>`:''}</div></div><button class="btn press" data-action="lesson-start">Bắt đầu</button>`;}
function chipsMarkup(q){const kind={review:'ÔN LẠI',new:'MỚI',practice:'LUYỆN LẠI'}[(view.queue||[]).find(i=>i.questionId===q.id)?.kind];return `<div class="chips">${kind?`<span class="chip step">${kind}</span>`:''}<span class="chip num mono">Câu ${E(qnum(q))}</span>${q.critical?'<span class="chip num">Điểm liệt</span>':''}${view.confusionEnabled&&step.phase!=='skipped'?`<span class="chip flag ${popFlag?'a-pop':''}">Đang phân vân</span>`:''}</div>`;}
function stepMarkup(){const v=view,ph=step.phase,q=ph==='skipped'?step.question:v.question,f=ph==='feedback'?v.currentFeedback:null,open=ph==='idle'||ph==='selected';return `${topBar()}${chipsMarkup(q)}<h2 class="stem" tabindex="-1" ${open?'data-focus':''}>${E(q.question)}</h2>${imageMarkup(q)}${optionsMarkup(q,f?f.selectedAnswer:ph==='skipped'?null:step.selection,!open,f)}${f?verdictMarkup(f,q):ph==='failed'?failedMarkup():ph==='skipped'?skippedMarkup():actionMarkup()}`;}
function actionMarkup(){return `<div class="act"><div class="act-row"><button class="chip-btn" data-action="guess" aria-pressed="${step.guess}">Tôi đoán</button><button class="link-btn" data-action="skip">Bỏ qua</button></div><button class="btn press" data-action="answer" ${step.selection===null?'disabled':''}>Kiểm tra</button></div>`;}
function verdictMarkup(f,q){const variant=!f.correct?'miss':f.assisted?'soft':'win',head=!f.correct?'Chưa đúng':f.assisted?'Đúng (có hỗ trợ)':f.confidence==='guess'?'Đúng — lần sau thử không đoán nhé':'Chính xác!',answer=(q.options||[]).find(o=>o.id===f.correctAnswer),gap=view.help?.explanation===null;
  // XP, combo and "Đã thuộc!" lines go after the headline row once the server reports them; the card never computes them.
  return `<section class="panel ${variant} ${A('a-rise')}" aria-labelledby="verdict">${variant==='miss'?'<div class="edge"></div>':''}<div class="panel-body"><div class="verdict-row"><div class="vicon">${variant==='miss'?`<span class="vbox ${A('a-shake')}">${icon(CROSS,20,3.2)}</span>`:`<span class="vbox ${variant==='win'?A('a-pop'):''}">${icon(CHECK,variant==='win'?26:24,variant==='win'?3:2.6)}</span>${variant==='win'&&animate?SPARKS:''}`}</div><h3 class="vhead" id="verdict" tabindex="-1" data-focus>${head}</h3></div>${f.correct?'':`<p class="right-line">Đáp án đúng: ${E(f.correctAnswer)}${answer?` · ${E(answer.text)}`:''}</p>`}<div class="why-wrap"><p class="why${step.expanded||gap?'':' clamp'}" id="why">${gap?'Chưa có giải thích được duyệt cho câu này.':E(f.explanation)}</p>${gap?'':`<button class="more" data-action="why" aria-expanded="${step.expanded}" aria-controls="why">${step.expanded?'Thu gọn':'Xem thêm'}</button>`}</div><button class="btn press" data-action="study-next">Tiếp tục</button></div></section>${helpersMarkup()}`;}
function helpersMarkup(){const video=(view.teaching?.videos||[]).find(x=>x?.verified===true&&safeImage(x.url));return `<div class="helpers"><button class="tile press" data-action="help">${icon(CHAT,16,2.2)}Hỏi ChatGPT</button><button class="tile press" data-action="confusion" aria-pressed="${Boolean(view.confusionEnabled)}">${icon(FLAG,16,2.2)}Tôi còn phân vân</button>${video?`<button class="tile press" data-action="source" data-value="${E(video.url)}" aria-label="Video, mở YouTube"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="${PLAY}"/></svg>Video</button>`:''}</div>`;}
function failedMarkup(){return `<div class="failrow">${icon(RETRY,18,2.2)}<span>Chưa gửi được — thử lại</span><button class="small-btn press" data-action="retry" data-focus>Thử lại</button></div>`;}
function skippedMarkup(){return `<div class="dashed ${A('a-rise')}"><p class="dashed-title" role="status" tabindex="-1" data-focus>Đã bỏ qua · vẫn cần ôn</p><button class="btn press" data-action="study-next">Tiếp tục</button></div>`;}
function pausedMarkup(){return `<h2 class="title" tabindex="-1" data-focus>Buổi học đã tạm dừng</h2><p class="lead">Các câu chưa làm và lịch ôn vẫn được giữ trên máy chủ.</p><button class="btn press" data-action="resume" data-value="${E(view.sessionId)}">Tiếp tục</button><button class="tertiary" data-action="course">Về khóa học</button>`;}
function finishMarkup(){const v=view,r=v.sessionResults||{},fresh=(v.queue||[]).filter(i=>i.kind==='new'&&i.status==='answered').length;
  // XP, newly mastered questions and the goal ring join these tiles once the server reports them.
  const tiles=[[r.correct??0,`/${r.answered??0}`,'đúng'],[fresh,'','câu mới'],[v.pendingDue??0,'','Cần ôn hôm nay']];return `<div class="burst" aria-hidden="true">${animate?BITS:''}<div class="trophy ${A('a-pop')}">${icon(CHECK,44,2.8)}</div></div><h2 class="finish-title" tabindex="-1" data-focus>Hoàn thành bài học!</h2><div class="tiles">${tiles.map(([n,of,label],i)=>`<div class="stat-tile${i?'':' inv'}"><b class="mono"><span data-count="${E(n)}">${E(n)}</span>${of?`<small>${E(of)}</small>`:''}</b><span>${label}</span></div>`).join('')}</div><button class="btn press" data-action="daily">Bài tiếp theo</button><button class="tertiary" data-action="course">Xong hôm nay</button>`;}
function postSummary(){const v=view,key='summary:'+v.sessionId,r=v.sessionResults||{};if(marked(key)||!canMessage())return;mark(key);sendToChat(`Xong bài: ${r.correct??0}/${r.answered??0} đúng. [session ${v.sessionId} · tổng kết]`).catch(e=>notice(e.message,true));}
function countUp(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;root.querySelectorAll('[data-count]').forEach((el,i)=>{const n=Number(el.dataset.count),start=performance.now()+i*350;if(!n)return;const tick=now=>{const t=Math.min(1,Math.max(0,(now-start)/400));el.textContent=String(Math.round(n*t));if(t<1&&el.isConnected)requestAnimationFrame(tick);};el.textContent='0';requestAnimationFrame(tick);});}
function focusStep(){root.querySelector('[data-focus]')?.focus({preventScroll:true});}
function mockMarkup(){const m=view;if(m.resumed&&resumedAttempt!==m.attemptId){resumedAttempt=m.attemptId;const next=(m.questions||[]).findIndex(q=>!(m.choices||{})[qid(q)]);mockIndex=next<0?0:next;}if(m.status==='abandoned')return `<h1>Đã dừng bài thi</h1><p>Lựa chọn tạm không được chấm hoặc tính vào lịch sử học.</p>${actions(B('Về khóa học','course',true))}`;if(['finalised','finalized','completed'].includes(m.status)||m.result){const r=m.result||m;return `<h1>Kết quả thi thử</h1><h2>${E(r.score??r.correctCount??r.correct??0)}/30 · ${r.passed?'Đạt':'Chưa đạt'}</h2><div class="verdict ${r.passed?'':'wrong'}"><strong>${(r.criticalFailures?.length||r.criticalFailure)?'Có câu điểm liệt sai hoặc bỏ trống':r.passed?'Đủ điểm theo cấu hình thi':'Chưa đủ điểm theo cấu hình thi'}</strong></div><p>${E(r.unansweredCount??r.results?.filter(x=>x.unanswered).length??0)} câu bỏ trống · ${E(r.wrongCount??r.results?.filter(x=>x.correct===false).length??0)} câu trả lời sai.</p><details class="progress-details"><summary>Xem câu cần học lại</summary>${(r.results||[]).filter(x=>x.correct===false||x.unanswered).map(x=>{const q=m.questions?.find(q=>qid(q)===x.questionId);return `<section class="answer-line"><h3>Câu ${E(x.questionId)}</h3><p>${E(q?.question)}</p><p>${x.unanswered?'Chưa trả lời':`Đã chọn ${E(x.selectedAnswer)}`} · Đáp án gốc ${E(x.correctAnswer)}</p>${x.explanation?`<p>${E(x.explanation)}</p>`:''}<small class="note">Câu gốc: ${E(q?.sourceId||x.questionId)} · Giải thích chưa được duyệt làm bài giảng.</small></section>`;}).join('')||'<p>Không có câu sai hoặc bỏ trống.</p>'}</details>${actions(B('Về khóa học','course',true),B('Thi lượt khác','mock-entry'))}`;}const qs=m.questions||[],q=question(),saved=m.answers||m.choices||{},answer=saved[qid(q)];step.selection=typeof answer==='object'?answer?.answer:answer??null;return `<div class="test-top"><h1>Thi thử ngẫu nhiên</h1><span class="timer" id="timer" aria-label="Thời gian còn lại"></span></div><p class="note">Câu ${mockIndex+1}/30 · Bộ đề riêng chưa được cung cấp.</p>${resumedAttempt===m.attemptId?`<div class="resume-note"><p>Bạn đang làm tiếp bài thi bắt đầu lúc ${E(new Date(m.createdAt).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}))}. Lựa chọn đã lưu vẫn giữ nguyên.</p>${B('Bắt đầu bài mới','mock-restart')}</div>`:''}${questionMarkup(q)}<p class="note">${drafts.has(`${lastIdentity}:${qid(q)}`)?'Lựa chọn chưa xác nhận lưu.':'Đáp án hiển thị là lựa chọn máy chủ đã lưu.'}</p><details class="test-index"><summary>Danh sách 30 câu</summary><div class="navigator">${qs.map((x,i)=>B(String(i+1),'mock-nav',false,false,i).replace('class=""',`class="${saved[qid(x)]?'answered':''} ${i===mockIndex?'active':''}"`)).join('')}</div></details>${confirmState?`<div class="confirm-panel" role="alertdialog" aria-live="assertive"><p>${E(confirmState.message)}</p>${actions(B(confirmState.label,'confirm-yes',true),B('Tiếp tục làm bài','confirm-no'))}</div>`:actions(B('Câu trước','mock-prev',false,mockIndex===0),B('Câu tiếp','mock-next',true,mockIndex>=qs.length-1),B('Nộp bài','mock-confirm'))}<details class="more-actions"><summary>Tùy chọn bài thi</summary>${actions(B('Dừng thi và học','mock-leave'))}</details>`;}
function practiceMarkup(){return `<h1>Luyện câu gốc</h1><p class="note">${savedAvailable()?'Câu trả lời được lưu vào lịch sử học.':'Lượt luyện này không lưu tiến độ hoặc lịch ôn.'}</p>${questionMarkup(view,Boolean(view.feedback),view.feedback)}${feedbackMarkup(view.feedback)}${actions(view.feedback?B('Câu tiếp theo','practice-next',true):B('Trả lời','practice-answer',true,step.selection===null),B('Về khóa học','course'))}`;}
function mockEntryMarkup(){return `<h1>Thi thử</h1><p>30 câu · 20 phút · cần 27 câu đúng và không sai hoặc bỏ trống câu điểm liệt.</p><div class="inline-teaching"><h3>Luyện đề ngẫu nhiên từ ngân hàng</h3><p>${savedAvailable()?'Bộ đề thi riêng chưa được cung cấp. Kết quả sẽ do máy chủ chấm khi nộp hoặc hết giờ.':'Thi thử cần lịch sử học đã lưu và chưa khả dụng trên kết nối này. Bạn vẫn có thể luyện từng câu theo chủ đề.'}</p></div>${actions(B('Bắt đầu 20 phút','mock-start',true,!savedAvailable()),B('Về khóa học','course'))}`;}
function render(){const openSections=new Set([...root.querySelectorAll('details[open]')].map(d=>d.className));const key=`${screen}|${screen==='study'?`${lessonScreen()}|${step.phase}`:''}|${qid(question())??''}`;animate=key!==renderKey;renderKey=key;const flag=screen==='study'&&view.confusionEnabled?`${view.sessionId}:${qid(question())}`:'';popFlag=Boolean(flag)&&flag!==flagKey;flagKey=flag;document.querySelector('.brand').hidden=screen==='study';document.querySelectorAll('.brand nav button').forEach(x=>{const active=x.dataset.action===(screen==='mock'||screen==='mock-entry'?'mock-entry':'course');x.classList.toggle('primary',active);x.setAttribute('aria-current',active?'page':'false');});root.className=screen==='study'?'content':'content legacy';root.innerHTML=screens[screen]?.()??'';root.querySelectorAll('details').forEach(d=>{if(openSections.has(d.className))d.open=true;});root.querySelector('.confirm-panel')?.scrollIntoView({block:'nearest'});const why=root.querySelector('.why.clamp');if(why&&why.scrollHeight<=why.clientHeight+1)root.querySelector('[data-action="why"]')?.remove();if(animate&&screen==='study'&&step.phase==='feedback')announce(root.querySelector('#verdict')?.textContent??'');if(animate)countUp();root.setAttribute('aria-busy',String(busy));if(busy)setBusy();if(retryTask)renderRetry();updateTimer();}
async function loadUnits(){return call('list_units',{kind:unitKind,query:search,offset:page*25,limit:25});}
function sessionArgs(){return {sessionId:view.sessionId,questionId:qid(question())};}
function mockArgs(){return {attemptId:view.attemptId};}
async function help(){const f=view.currentFeedback,q=view.question;await call('request_study_help',{...sessionArgs(),helpKind:'explanation'},true,async()=>{if(!canMessage()){notice('Máy chủ đã ghi nhận hỗ trợ. Host này không gửi được yêu cầu vào ChatGPT; hãy hỏi trong cuộc trò chuyện.',true);return;}await sendToChat(`Giải thích giúp mình câu ${qnum(q)}: mình chọn ${f.selectedAnswer}, đáp án là ${f.correctAnswer}. [${qid(q)} · chọn ${f.selectedAnswer} · ${f.correct?'đúng':'sai'}]`);notice('Đã gửi câu hỏi cho ChatGPT.');});}
root.addEventListener('submit',event=>{event.preventDefault();if(event.target.id==='unit-search'){search=document.querySelector('#search').value.trim();page=0;loadUnits();}if(event.target.id==='goal-form'){const choice=new FormData(event.target).get('goal');const n=choice==='custom'?Number(document.querySelector('#custom-goal').value):Number(choice);if(!Number.isInteger(n)||n<1||n>600){notice('Chọn số nguyên từ 1 đến 600.',true);return;}call('update_profile',{dailyGoal:n},true);}});
document.addEventListener('input',event=>{if(event.target.id==='custom-goal'){const custom=document.querySelector('input[name="goal"][value="custom"]');if(custom)custom.checked=true;}});document.addEventListener('change',event=>{if(retryTask){notice('Thử lại yêu cầu chưa xác nhận trước khi thay đổi lựa chọn.',true);render();return;}if(event.target.name!=='answer')return;step.selection=event.target.value;const q=question(),key=`${lastIdentity}:${qid(q)}`;if(screen==='mock'){drafts.set(key,step.selection);queueMockSave(view.attemptId,qid(q),step.selection,key);return;}step.phase='selected';document.querySelector('[data-action="answer"], [data-action="practice-answer"]')?.removeAttribute('disabled');});
document.addEventListener('click',async event=>{const el=event.target.closest('[data-action]');if(!el||busy)return;const a=el.dataset.action,v=el.dataset.value;if(a==='retry'){await retryTask?.();focusStep();return;}if(retryTask){notice('Thử lại yêu cầu trước để kiểm tra lựa chọn đã lưu.',true);renderRetry();return;}if(!['zoom','close-zoom','source','guess','why'].includes(a))notice('');if(a==='close-zoom'){document.querySelector('#zoom').close();return;}if(a==='zoom'){const image=document.querySelector('#zoom img');image.src=v;image.alt='Hình minh họa câu hỏi gốc, phóng to';document.querySelector('#zoom').showModal();return;}if(a==='source'){if(capabilities.openLinks)rpc('ui/open-link',{url:v}).catch(e=>notice(e.message,true));else notice('Host không mở được liên kết nguồn.',true);return;}if(a==='guess'){step.guess=!step.guess;el.setAttribute('aria-pressed',String(step.guess));return;}if(a==='why'){step.expanded=!step.expanded;render();root.querySelector('[data-action="why"]')?.focus();return;}if(a==='lesson-start'){mark('started:'+view.sessionId);render();focusStep();return;}if(a==='confirm-yes'){const run=confirmState?.run;confirmState=null;render();if(run)await run();return;}if(a==='confirm-no'){confirmState=null;render();return;}if(a==='mock-restart'){confirmState={message:'Bỏ bài đang làm và bắt đầu bài mới? Lựa chọn của bài cũ sẽ không được chấm.',label:'Bắt đầu bài mới',run:async()=>{await call('abandon_mock_test',mockArgs(),true);if(!retryTask)await call('start_mock_test',{mode:'random'},true);}};render();return;}if(a==='mock-confirm'||a==='mock-leave'){if(a==='mock-confirm'){await saveChain;if([...drafts.keys()].some(k=>k.startsWith(`${lastIdentity}:`))){notice('Còn lựa chọn chưa lưu. Chọn lại đáp án đó để lưu trước khi nộp bài.',true);render();return;}}const m=view,saved=m.answers||m.choices||{},n=(m.questions||[]).filter(q=>!saved[qid(q)]).length;confirmState=a==='mock-leave'?{message:'Dừng bài thi? Những lựa chọn tạm sẽ không được chấm hoặc tính vào lịch sử học.',label:'Dừng bài thi',run:()=>call('abandon_mock_test',mockArgs(),true)}:{message:`${n?`${n} câu chưa trả lời. `:''}Nộp bài và chấm ngay?`,label:'Nộp bài',run:()=>call('finalise_mock_test',{...mockArgs(),confirmUnanswered:true},true)};render();return;}if(['course','review','mock-entry','goals','categories','families','unit'].includes(a)&&screen==='mock'&&view.status==='active'){confirmState={message:'Rời và dừng bài thi? Những lựa chọn tạm sẽ không được chấm.',label:'Dừng và rời',run:()=>call('abandon_mock_test',mockArgs(),true)};render();return;}if(a==='course')return call('get_course');if(a==='goals'){screen='goals';render();return;}if(a==='mock-entry'){screen='mock-entry';render();return;}if(a==='mock-start')return call('start_mock_test',{mode:'random'},true);if((a==='daily'||a==='review')&&!savedAvailable()){notice('Ôn tập cần lịch sử học đã lưu. Bạn vẫn có thể chọn một chủ đề để luyện câu gốc không lưu.',true);return;}
if(a==='daily'||a==='review')return call('start_study',a==='review'?{reviewOnly:true}:{},true,data=>{if(data?.nothingToStudy)notice(a==='review'?'Không có câu nào đến hạn ôn lúc này. Chọn một chủ đề để luyện thêm.':'Hôm nay không còn câu đến hạn ôn và bạn đã đạt mục tiêu câu mới. Chọn một chủ đề để luyện thêm.');});if(a==='categories'||a==='families'){unitKind=a==='families'?'family':'category';search='';page=0;return loadUnits();}if(a==='units-prev'||a==='units-next'){page+=a==='units-next'?1:-1;return loadUnits();}if(a==='unit'){if(savedAvailable())return call('start_study',{unitId:v,override:true},true);const unit=(units?.units||course?.units||[]).find(x=>x.id===v);return call('get_question',unit?.firstQuestionId?{questionId:unit.firstQuestionId}:{topic:v});}
