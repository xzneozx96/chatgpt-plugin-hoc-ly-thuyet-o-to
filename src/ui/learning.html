function accept(result,external=false){let data;try{data=unpack(result);}catch(e){if(e.code==='LIBRARY_UNAVAILABLE'){screen='mock-library';view=null;notice('');render();return;}notice(e.message,true);return;}if(!data||typeof data!=='object')return;data=data.view||data;let kind=data.kind||(data.options&&data.question?'practice':'');if(!screens[kind])return;const identity=data.sessionId||data.attemptId||'';const rev=Number(data.revision??data.version??-1);if(identity&&identity===lastIdentity&&rev>=0&&rev<revision)return;if(external&&busy)return;if(external&&Number.isFinite(data.serverNow)&&data.serverNow<lastServerNow)return;if(Number.isFinite(data.serverNow))lastServerNow=data.serverNow;if(identity!==lastIdentity){revision=-1;lastIdentity=identity;mockIndex=0;step=idleStep();}if(rev>=0)revision=rev;if(Number.isFinite(data.serverNow))clockOffset=data.serverNow-Date.now();else if(data.deadline&&Number.isFinite(data.remainingMs))clockOffset=data.deadline-data.remainingMs-Date.now();const oldQuestion=qid(question()),oldRepair=view?.repairOf;if(kind==='course'){course=data;if(firstVisit(data)&&screen!=='goal-saved'){goalFrom='first';kind='goals';}}if(kind==='league'){leagueConfirm=false;leagueError='';if(data.joined)leagueName='';}if(kind==='units'){if(!search)famSugg=data.suggestions||[];const kept=data.units?.some(x=>x.id===famSel)||data.suggestions?.some(x=>x.id===famSel);if(!kept&&!search)famSel=null;}if(kind==='study'&&data.mode==='lightning'){if(identity!==lastIdentity){ltFlash='';ltOpen=new Set();}if(Number.isFinite(data.remainingMs))ltDeadline=performance.now()+data.remainingMs;if(data.remainingMs>0)ltExpiring=null;const f=data.currentFeedback,x=data.lastAward?.baseXp;if(f)ltFlash=`Câu ${qnum({id:f.questionId})}: ${f.correct?`chính xác!${x?` ${signedXp(x)} XP`:''}`:`chưa đúng${x?` ${signedXp(x)} XP`:''} — sẽ quay lại trong lịch ôn`}`;}if(kind==='study'&&(data.pair?.group??'')!==pairGroup){pairGroup=data.pair?.group??'';pairChoices=new Map();}if(external)notice('') const INFO_ICON=icon('info',20);

// Questions with one qualifying answer get their own line under Đã thuộc, never added to its number.

function numTiles(c,small=false,info=true){const graphic=name=>`<span class="stat-graphic" aria-hidden="true">${icon(name,30)}</span>`,four=Number.isFinite(c.wrong),n=(v,of)=>small?`<b class="mono">${E(v)}${of?`<small>/${E(of)}</small>`:''}</b>`:`<div class="metric-total"><b class="mono">${E(v)}</b>${of?`<small class="mono">/${E(of)}</small>`:'<small>câu</small>'}</div>`,label=(text,key,ctx)=>`<span>${text}</span>${info?infoButton(key,text,ctx):''}`;return `<div class="nums${small?' sm':''}${four?' four':''}"><div class="ntile">${graphic(GRID)}${n(c.covered,c.total)}${label('Đã gặp','covered')}${four?`<i class="nbar" aria-hidden="true" style="--p:${Math.min(100,c.covered/c.total*100)}%"><i></i></i>`:''}</div><div class="ntile mid">${graphic(CHECK)}${n(c.learned,c.total)}${label('Đã thuộc','learned',{onTheWay:c.onTheWay,nextLearnAt:c.nextLearnAt})}${c.onTheWay>0?`<small class="nwait"><span class="mono">+${E(c.onTheWay)}</span> đang chờ ôn lại</small>`:''}</div><div class="ntile inv">${graphic(RETRY)}${n(c.due)}${label('Cần ôn hôm nay','due')}</div>${four?`<div class="ntile tap${c.wrong?'':' off'}">${graphic(WARN)}<button class="ntile-hit" data-action="mistakes" aria-label="Sai hôm nay: ${c.wrong?`${E(c.wrong)} câu, xem lại`:'chưa có câu sai hôm nay'}" ${c.wrong?'':'disabled'}>${n(c.wrong)}<span>Sai hôm nay</span><small class="nlink">${c.wrong?`Xem lại${icon(CHEVRON,12)}`:'Chưa có câu sai hôm nay'}</small></button>${info?infoButton('wrong','Sai hôm nay'):''}</div>`:''}</div>`;}

// Home card (PRD 8): the goal ring, the four numbers, the league line, the forecast and one "Học tiếp".
function streakMarkup(streak){if(!streak)return '';const flame='<svg viewBox="0 0 48 56" fill="none" aria-hidden="true"><path d="M25 3c3 13-8 15-5 27 5-2 8-6 9-11 10 8 15 15 13 23-2 9-9 13-18 13S7 50 6 41C4 28 17 21 25 3Z" fill="currentColor"/><path d="M24 32c0 7-8 9-6 15 1 4 5 6 9 4 7-4 3-12-3-19Z" fill="var(--amber-soft)"/></svg>';return `<section class="streak-block" aria-label="Chuỗi ngày học"><div class="streak-heading"><span class="streak-flame">${flame}</span><div><h2><b class="mono">${E(streak.days)}</b> ngày liên tiếp</h2><p>${streak.activeToday?'Hôm nay bạn đã học!':streak.days?'Học một câu để tiếp nối hôm nay.':'Bắt đầu chuỗi ngày học hôm nay.'}</p></div></div><div class="streak-week" aria-label="Hoạt động 7 ngày gần nhất">${streak.week.map(day=>{const date=new Date(day.date+'T12:00:00Z'),label=new Intl.DateTimeFormat('vi-VN',{weekday:'short',timeZone:'UTC'}).format(date);return `<div class="streak-day${day.active?' active':''}${day.today?' today':''}" aria-label="${E(day.date)}: ${day.active?'đã học':'chưa học'}${day.today?', hôm nay':''}"><span>${E(label.replace('Th ', 'T'))}</span><i>${day.active?icon(CHECK,14):'<span aria-hidden="true">·</span>'}</i></div>`;}).join('')}</div><p class="streak-note">Một câu đã trả lời là một ngày học.</p></section>`;}
function homeMarkup(){
  const c=course||{},date=localDate(c.serverNow??Date.now(),{weekday:'long',day:'numeric',month:'numeric'});
  if(!savedAvailable(c))return `<div class="lesson">${lxHead(E(date))}${signinMarkup()}<button class="btn press" data-action="map">Chọn chủ đề để luyện</button></div>`;
  const league=c.leagueSummary,running=(c.mocks||[]).some(m=>m.status==='active'),finish=c.covered>=c.total?'Bạn đã gặp đủ 600 câu.':c.forecastFinishAt?`Theo nhịp ${E(c.dailyGoal)} câu/ngày: xong lượt đầu ngày ${E(localDate(c.forecastFinishAt,{day:'numeric',month:'numeric'}))}`:'',units=mapUnits().filter(u=>!u.custom),next=mapNext(units),current=units[next],following=units[next+1];

Tuần này bạn có <span class="mono">${E(league.weekXp)} XP</span></small>`:''}</span>${icon(CHEVRON,18)}</button>`:''}<section class="daily-block" aria-label="Mục tiêu hôm nay">${goalPanel({newToday:c.newToday,dailyGoal:c.dailyGoal,dueCount:c.dueCount},c.dueCount?`Còn ${E(c.dueCount)} câu ôn — làm trước`:'Đã ôn xong hôm nay')}<button class="goal-adjust" data-action="goals">Đổi mục tiêu</button></section>${streakMarkup(c.streak)}</aside></div><section class="dashboard-section progress-block" aria-label="Tiến độ khóa học"><h2 class="section-heading">Tiến độ khóa học</h2>${numTiles({covered:c.covered,learned:c.learned,onTheWay:c.onTheWay,nextLearnAt:c.nextLearnAt,total:c.total,due:c.dueCount,wrong:c.wrongToday})}${finish?`<p class="forecast-line">${finish}</p>`:''}</section>${running?'<p class="note">Bạn còn một bài thi thử chưa nộp. <button class="more" data-action="mock-start">Làm tiếp bài thi</button></p>':''}</div>`;
}
// Daily reminder: the card cannot notify, so one chat message asks ChatGPT to create a daily scheduled task.
// The learner confirms it in the chat; the card stores nothing and claims nothing beyond having sent the request.
const REMIND_TIMES=['07:00','12:00','20:00'];
function remindMarkup(){const r=remind;return `<div class="remind"><div class="remind-row"><button class="remind-btn" id="remind-toggle" data-action="remind" aria-expanded="${r.open}" aria-controls="remind-panel">${icon(BELL,16)}Nhắc tôi học mỗi ngày</button>${infoButton('remind','Nhắc tôi học mỗi ngày')}</div>${r.open?`<div class="remind-panel ${A('a-rise')}" id="remind-panel"><p class="eyebrow" aria-hidden="true">Giờ nhắc mỗi ngày</p><fieldset class="remind-times"><legend class="sr">Giờ nhắc mỗi ngày</legend>${REMIND_TIMES.map(t=>`<label class="time-chip mono"><input type="radio" name="remind" value="${t}" ${r.choice===t?'checked':''}>${t}</label>`).join('')}<label class="sr" for="remind-custom">Giờ khác (HH:MM)</label><input id="remind-custom" class="time-custom mono${r.choice==='custom'?' on':''}" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="HH:MM" value="${E(r.custom)}" aria-describedby="remind-error"></fieldset><p class="field-error" id="remind-error" role="alert">${E(r.error)}</p><button class="btn2 press" data-action="remind-send" ${r.sending?'disabled':''}>Nhờ ChatGPT nhắc tôi</button></div>`:r.sent?`<p class="remind-sent" role="status">${icon(CHECK,16)}Đã gửi yêu cầu. Xác nhận trong khung chat nhé.</p>`:''}</div>`;}
// Accepts 21:30, 2130, 21h30, 21h or 7, and returns HH:MM, or null for anything that is not a time of day.
function clockTime(value){const m=String(value).trim().match(/^(\d{1,2})(?:\s*[:.hHgG]\s*(\d{2})?|(\d{2}))?$/);if(!m)return null;const h=Number(m[1]),min=Number(m[2]??m[3]??0);return h<24&&min<60?`${String(h).padStart(2,'0')}:${String(min).padStart(2,'0')}`:null;}
async function sendReminder(){if(remind.sending)return;const time=remind.choice==='custom'?clockTime(remind.custom):remind.choice;if(!time){remind.error='Nhập giờ dạng HH:MM, ví dụ 21:30.';render();document.querySelector('#remind-custom')?.focus();return;}remind.error='';if(!canMessage()){render();notice(`Host này không gửi được yêu cầu vào ChatGPT; hãy nhắn “Nhắc tôi học lý thuyết lái xe lúc ${time} mỗi ngày” trong cuộc trò chuyện.`,true);return;}remind.sending=true;render();try{await sendToChat(`Hãy tạo lời nhắc hằng ngày lúc ${time} để mình học lý thuyết lái xe. [nhắc học · ${time} hằng ngày]`);remind={...remind,open:false,sending:false,sent:true};render();document.querySelector('#remind-toggle')?.focus({preventScroll:true});}catch{remind={...remind,sending:false,error:'Chưa gửi được vào khung chat. Thử lại nhé.'};render();}}
// Goal picker (PRD 11, A2a): study days use the server's arithmetic, remaining questions over the goal within 60 days.
function goalDays(goal){return Math.ceil(Math.max(0,600-(course?.covered??0))/goal);}
function goalLines(goal){const d=goalDays(goal);return d<=60?[`${d} ngày học`,d===60?'xong trong 60 ngày':`dư ${60-d} ngày`]:[`${d} ngày học`,'quá 60 ngày'];}
function goalForecast(goal){if(!goal)return {label:'—',cells:[...Array(60)].map(()=>''),text:'Chọn một mức để xem dự báo.',over:false};const d=goalDays(goal),left=600-(course?.covered??0);return {label:`${d} ngày học`,cells:[...Array(60)].map((_,i)=>i<Math.min(d,60)?(d>60?'over':'on'):''),text:d<=60?`Xong lượt đầu ${left===600?'600 câu':`${left} câu còn lại`} sau ${d} ngày học, còn ${60-d} ngày dự phòng.`:`${d} ngày — quá 60 ngày. Bạn vẫn có thể giữ mức này.`,over:d>60};}
function goalValue(){return goalPick==='custom'?goalCustom:goalPick;}
function goalsMarkup(){const first=goalFrom==='first',f=goalForecast(goalValue());return `<form id="goal-form" class="goal-form" novalidate>${lxHead(first?'Bước 1/2':'Mục tiêu')}<img class="journey-art" src="{{BASE_URL}}/ui/assets/learning-journey.webp" alt="" width="440" height="280"><h2 class="goal-q" tabindex="-1" data-focus>Mỗi ngày bạn muốn học bao nhiêu câu mới?</h2><fieldset class="goal-grid"><legend class="sr">Số câu mới mỗi ngày</legend>${[10,12,15].map(n=>{const [a,b]=goalLines(n);return `<label class="gtile press">${n===12?'<span class="rec">ĐỀ XUẤT</span>':''}<input type="radio" name="goal" value="${n}" ${goalPick===n?'checked':''}><span class="n mono">${n}</span><b>câu/ngày</b><small>${a}</small><small>${b}</small></label>`;}).join('')}</fieldset><div class="ctile"><label><input type="radio" name="goal" value="custom" ${goalPick==='custom'?'checked':''}><b>Tự chọn</b><small>Số câu bất kỳ, xem số ngày ngay</small></label><div class="stepper"><button type="button" class="press" data-action="goal-dec" aria-label="Giảm một câu">−</button><label class="sr" for="custom-goal">Số câu mới mỗi ngày (1–600)</label><input id="custom-goal" class="mono" type="number" inputmode="numeric" min="1" max="600" value="${E(goalCustom)}"><button type="button" class="press" data-action="goal-inc" aria-label="Tăng một câu">+</button></div></div><div class="fc"><div class="fc-head"><span class="eyebrow">Dự báo 60 ngày</span><span class="mono" id="fc-label">${f.label}</span></div><div class="cells" aria-hidden="true">${f.cells.map((k,i)=>`<i class="${k}" style="animation-delay:${(i*.008).toFixed(3)}s"></i>`).join('')}</div><div class="fc-ends mono" aria-hidden="true"><span>Ngày 1</span><span>Ngày 60</span></div><p class="fc-text${f.over?' over':''}" id="fc-text" aria-live="polite">${f.text}</p></div><p class="note">Câu ôn tập được tính riêng và luôn làm trước.</p><button class="btn press" type="submit" ${goalValue()?'':'disabled'}>${first?'Bắt đầu':'Lưu mục tiêu'}</button>${first?'':'<button class="tertiary" type="button" data-action="course">Quay lại</button>'}</form>`;}
// Updates the forecast in place so typing a custom goal keeps the field's focus.
function updateGoal(){const f=goalForecast(goalValue());const label=document.querySelector('#fc-label'),text=document.querySelector('#fc-text');if(label)label.textContent=f.label;if(text){text.textContent=f.text;text.classList.toggle('over',f.over);}document.querySelectorAll('.cells i').forEach((cell,i)=>{cell.className=f.cells[i];});const submit=document.querySelector('#goal-form [type="submit"]');if(submit)submit.disabled=!goalValue();}
function goalSavedMarkup(){const c=course||{},saved=savedAvailable(c);return `<div class="lesson">${lxHead('Bước 2/2')}<div class="step2 ${A('a-rise')}"><div class="bigicon goalbox ${A('a-pop')}"><span class="mono">${E(c.dailyGoal)}</span><small>câu/ngày</small></div><h2 class="title" tabindex="-1" data-focus>${saved?'Tiến độ của bạn được lưu':'Tiến độ chưa được lưu'}</h2><p class="lead">${saved?c.persistence==='authenticated'?'Tài khoản đã kết nối, nên lịch ôn và kết quả được giữ qua mọi cuộc trò chuyện.':'Lịch ôn và kết quả được lưu trên máy chủ, kể cả khi bạn tải lại thẻ.':'Kết nối này chưa lưu lịch sử học. Khi bạn muốn lưu, ChatGPT sẽ hỏi kết nối tài khoản.'}</p>${saved?'<button class="btn press" data-action="daily">Học bài đầu</button>':'<button class="btn press" data-action="map">Chọn chủ đề để luyện</button>'}<button class="tertiary" data-action="goals">Đổi mục tiêu</button></div></div>`;}
// Path order follows the bank; appearance never gates access to a topic.
function mapUnits(){const c=course||{},x=c.customCategory;return [...(c.units||[]).map(u=>({id:u.id,title:SHORT[u.id]??u.title,total:u.questionCount,covered:u.covered,learned:u.learned,onTheWay:u.onTheWay,due:u.due,firstQuestionId:u.firstQuestionId})),...(x?[{id:x.id,title:SHORT[x.id]??x.title,total:x.total,covered:x.covered,learned:x.learned,onTheWay:x.onTheWay,due:x.due??0,families:x.familyCount,custom:true}]:[])];}

function chipsMarkup(q,label){const kind=label??(view.repairOf?'THỬ LẠI':{review:'ÔN LẠI',new:'MỚI',practice:'LUYỆN LẠI'}[view.itemKind]),combo=view.mode==='lesson'&&view.combo>=3&&!['feedback','skipped'].includes(step.phase);return `<div class="chips">${kind?`<span class="chip step">${kind}</span>${kind==='THỬ LẠI'?infoButton('repair','Thử lại'):''}`:''}<span class="chip num mono">Câu ${E(qnum(q))}</span>${q.critical?'<span class="chip num">Điểm liệt</span>':''}${view.confusionEnabled&&step.phase!=='skipped'?`<span class="chip flag ${popFlag?'a-pop':''}">Đang phân vân</span>`:''}${combo?`<span class="combo-pill mono" aria-label="${E(view.combo)} câu đúng liên tiếp">${solid(BOLT,14)}×${E(view.combo)}</span>`:''}</div>`;}
function stepMarkup(){const v=view,ph=step.phase,q=ph==='skipped'?step.question:v.question,f=ph==='feedback'?v.currentFeedback:null,open=ph==='idle'||ph==='selected';return `${topBar()}<div class="study-main"><div class="study-body"><div class="question-meta">${chipsMarkup(q,ph==='skipped'?step.kind:undefined)}${studyOptionsMarkup(open)}</div>${v.repairOf&&ph!=='skipped'?'<p class="repair-line">Bạn đã sai câu này lúc nãy</p>':''}<h2 class="stem" tabindex="-1" ${open?'data-focus':''}>${E(q.question)}</h2>${imageMarkup(q)}${optionsMarkup(q,f?f.selectedAnswer:ph==='skipped'?null:step.selection,!open,f&&!f.correct&&!step.expanded?{...f,correctAnswer:null}:f,f)}</div>${f?verdictMarkup(f,q):ph==='failed'?failedMarkup():ph==='skipped'?skippedMarkup():actionMarkup()}</div>`;}

// XP, combo and "Đã thuộc!" come from the server's award for this answer; the card never computes them.
function verdictMarkup(f,q){const v=view,repair=Boolean(v.repairOf),variant=!f.correct?'miss':f.assisted&&!repair?'soft':'win',answer=(q.options||[]).find(o=>o.id===f.correctAnswer),gap=v.help?.explanation===null||f.teachingStatus==='teaching_gap',deep=!f.correct&&repair;

function helpersMarkup(helpInPanel=false){const video=(view.teaching?.videos||[]).find(x=>x?.verified===true&&safeImage(x.url));return video?`<button class="deep" data-action="source" data-value="${E(video.url)}" aria-label="Video, mở YouTube">${icon(PLAY,16)}Video</button>`:'';}
// Compare the pair (INT-02): both questions are answered before either verdict shows, then one "Tiếp tục".

function pairAnswered(id){return (view.queue||[]).some(i=>i.group===view.pair?.group&&i.questionId===id&&i.status==='answered');}

function pairQuestion(q,f){const hidden=!f&&pairAnswered(q.id),opts=Array.isArray(q.options)?q.options:[],short=opts.every(o=>[...String(o.text)].length<=14),picked=f?f.selectedAnswer:pairChoices.get(q.id)??null,xp=f?.award?.baseXp?` <span class="mono">${E(signedXp(f.award.xp))} XP</span>`:'';const chip=!f?'':f.correct?`<span class="vchip ${A('a-pop')}">${icon(CHECK,13)}${f.assisted?'Đúng (có hỗ trợ)':'Chính xác!'}${xp}</span>`:`<span class="vchip miss ${A('a-shake')}">${icon(CROSS,12)}Chưa đúng${xp}</span>`;return `<section class="pair-q" aria-label="Câu ${E(qnum(q))}"><div class="pq-head"><span class="qchip mono">CÂU ${E(qnum(q))}</span>${q.critical?'<span class="chip num">Điểm liệt</span>':''}${chip}</div><p class="pstem">${E(q.question)}</p>${imageMarkup(q)}<fieldset class="ptiles${short?' short':''}" style="--n:${opts.length}" ${f||hidden?'disabled':''}><legend class="sr">Đáp án câu ${E(qnum(q))}</legend>${opts.map((o,i)=>{const k=choiceKey(o,i),right=Boolean(f)&&k===f.correctAnswer,wrong=Boolean(f)&&k===f.selectedAnswer&&!right;return `<label class="ptile ${right?'right':wrong?'wrong':f?'dim':''}"><input type="radio" name="pair-${E(q.id)}" value="${E(k)}" ${picked===k?'checked':''}><span class="k mono" aria-hidden="true">${E(k)}</span><span class="sr">${E(k)}.</span><span class="t">${E(o.text)}</span>${right?`<span class="pbadge ${A('a-pop')}" aria-hidden="true">${icon(CHECK,12)}</span><span class="sr">Đáp án đúng</span>`:wrong?`<span class="pbadge" aria-hidden="true">${icon(CROSS,11)}</span><span class="sr">Bạn chọn</span>`:''}</label>`;}).join('')}</fieldset>${hidden?'<p class="note">Đã trả lời — kết quả hiện cùng câu còn lại.</p>':''}</section>`;}
// The family's comparison axes name what tells the two questions apart; each question keeps its own bank explanation.
function diffMarkup(p){return `<section class="diff ${A('a-rise')}" aria-labelledby="diff-title"><span class="eyebrow">Khác nhau ở</span><h3 class="diff-title" id="diff-title" tabindex="-1" data-focus>${E(p.title)}</h3>${p.axes?.length?`<ul class="axes">${p.axes.map(a=>`<li>${E(a)}</li>`).join('')}</ul>`:''}<button class="btn press" data-action="study-next">Tiếp tục</button></section>`;}
function pairMarkup(){const v=view,p=v.pair,both=p.feedback.every(Boolean),started=p.questions.some(q=>pairAnswered(q.id));return `${topBar()}<div class="intro-head"><span class="chip step">${solid(STAR,11)}THỬ THÁCH</span><h2 class="title" tabindex="-1" ${both||step.phase==='failed'?'':'data-focus'}>Hai câu dễ nhầm</h2><p class="lead">Chọn đáp án cho cả hai câu rồi kiểm tra một lần.</p></div>${p.questions.map((q,i)=>pairQuestion(q,p.feedback[i])).join('')}${both?diffMarkup(p):step.phase==='failed'?failedMarkup():`<button class="btn press" data-action="pair-check" ${pairReady()?'':'disabled'}>Kiểm tra cả hai</button>${started?'':'<button class="tertiary" data-action="skip">Bỏ qua cặp này</button>'}`}`;}
// One submit per unanswered question, in order; a lost response stops here and its retry resends that one only.
async function pairCheck(){const v=view,p=v.pair;for(const q of p.questions){if(pairAnswered(q.id))continue;step.phase='submitting';await call('submit_study_answer',{sessionId:v.sessionId,questionId:q.id,answer:pairChoices.get(q.id)},true,null,false,{onError:resync});if(retryTask){step.phase='failed';render();return;}if(view.pair?.group!==p.group)return;}}
// Lightning round (INT-03): 60 seconds over questions already seen, no explanations until the round is over.
function clockText(ms){const t=Math.ceil(Math.max(0,ms)/1000);return `${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`;}
function ltLeft(){return Math.max(0,ltDeadline-performance.now());}
function ltTop(ok,ms){return `<div class="lt-top"><span class="lt-chip">${solid(BOLT,11)}CHỚP NHOÁNG</span><span class="timer-chip mono" id="lt-timer" role="timer" aria-label="Thời gian còn lại">${clockText(ms)}</span><span class="okcount mono" aria-label="${E(ok)} câu đúng">${icon(CHECK,16)}${E(ok)}</span></div><div class="tbar" aria-hidden="true"><i id="lt-bar" style="width:${(ms/600).toFixed(1)}%"></i></div>`;}
function lightningIntroMarkup(){return `<div class="lesson">${ltTop(0,60000)}<div class="lt-intro ${A('a-rise')}"><div class="bigicon ${A('a-pop')}">${solid(BOLT,40)}</div><h2 class="title" tabindex="-1" data-focus>Trả lời nhanh nhất có thể</h2><p class="lead">60 giây · câu đã gặp · trả lời sai vẫn được ghi vào lịch ôn</p><button class="btn press" data-action="lightning-start">Bắt đầu</button><button class="tertiary" data-action="course">Để sau</button></div></div>`;}
function ltRunMarkup(){const v=view,q=v.question,f=v.currentFeedback,locked=Boolean(f)||step.phase==='submitting'||step.phase==='failed';return `${ltTop(v.correctCount??0,ltLeft())}<span class="chip num mono" style="align-self:flex-start">Câu ${E(qnum(q))}</span><h2 class="stem" tabindex="-1" ${locked?'':'data-focus'}>${E(q.question)}</h2>${imageMarkup(q)}${optionsMarkup(q,f?f.selectedAnswer:step.selection,locked)}<p class="flash" role="status" aria-live="polite">${E(ltFlash)}</p>${step.phase==='failed'?failedMarkup():f?'<button class="btn press" data-action="lt-next">Câu tiếp</button>':`<button class="btn press" data-action="lt-check" ${step.selection===null?'disabled':''}>Kiểm tra</button>`}<p class="hint">Enter cũng xác nhận · không có giải thích trong lượt chơi</p>`;}
function ltOverMarkup(){const v=view,review=v.review||[],wrong=v.wrongItems||[];return `${ltTop(v.correctCount??0,0)}<h2 class="title" tabindex="-1" data-focus>${v.remainingMs>0?'Hết câu!':'Hết giờ!'}</h2><div class="tiles"><div class="stat-tile inv"><b class="mono"><span data-count="${E(v.correctCount??0)}">${E(v.correctCount??0)}</span></b><span>đúng</span></div><div class="stat-tile"><b class="mono">${E(wrong.length)}</b><span>chưa đúng</span></div><div class="stat-tile line"><b class="mono">${E(signedXp(v.xp??0))}</b><span class="with-info">XP${infoButton('xp','XP')}</span></div></div>${review.length?`<div class="lt-list">${review.map(r=>{const q=r.question,open=ltOpen.has(q.id),pick=k=>(q.options||[]).find(o=>o.id===k)?.text??'';return `<div class="lt-item"><button class="lt-row" data-action="lt-review" data-value="${E(q.id)}" aria-expanded="${open}"><span class="stripe-box" aria-hidden="true"></span><span class="mono">Câu ${E(qnum(q))}</span><span class="link">${open?'Thu gọn':'Xem lại'}</span></button>${open?`<div class="lt-detail ${A('a-rise')}"><p class="pstem">${E(q.question)}</p>${imageMarkup(q)}<p class="answer">Đáp án đúng: ${E(r.correctAnswer)} · ${E(pick(r.correctAnswer))}</p><p class="note">Bạn chọn: ${E(r.chosen)} · ${E(pick(r.chosen))}</p></div>`:''}</div>`;}).join('')}</div>`:''}<button class="btn press" data-action="course">Tiếp tục</button>`;}
// Answers go to the server whatever the local clock says; LIGHTNING_EXPIRED ends the round from the server's view.

async function ltCheck(){if(busy||step.selection===null||step.phase==='submitting'||view.currentFeedback)return;step.phase='submitting';render();await call('submit_study_answer',{...sessionArgs(),answer:step.selection},true,null,false,{onError:ltEnd});if(retryTask?.request?.name==='submit_study_answer'){step.phase='failed';render();return;}if(step.phase==='submitting')step.phase='selected';if(view?.mode==='lightning'&&view.currentFeedback&&view.status==='active')await call('next_study_question',{sessionId:view.sessionId},true,null,false,{onError:ltEnd});focusStep();}
// When the countdown reaches zero the card asks the server once; the server closes the round and returns its summary.
function ltTick(){if(screen!=='study'||view?.mode!=='lightning'||lessonScreen()!=='ltrun')return;const left=ltLeft(),timer=document.querySelector('#lt-timer'),bar=document.querySelector('#lt-bar');if(timer)timer.textContent=clockText(left);if(bar)bar.style.width=`${(left/600).toFixed(1)}%`;if(left<=0&&ltExpiring!==view.sessionId&&!busy&&!retryTask){ltExpiring=view.sessionId;call('get_study_session',{sessionId:view.sessionId});}}

// Today's goal ring: one segment per new question in the goal (at most 30 drawn), with a check once due reviews are done.
function ring(done,goal,check,size=88){const n=Math.max(1,Math.min(goal,30)),on=Math.round(Math.min(done,goal)/goal*n),c=size/2,r=c-7,gap=n>1?Math.min(8,90/n):0,pt=a=>`${(c+r*Math.cos(a*Math.PI/180)).toFixed(2)} ${(c+r*Math.sin(a*Math.PI/180)).toFixed(2)}`;let segs='';for(let i=0;i<n;i++){const a0=-90+i*360/n+gap/2,a1=-90+(i+1)*360/n-gap/2;segs+=n===1?`<circle class="seg${on?' on':''}" cx="${c}" cy="${c}" r="${r}"/>`:`<path class="seg${i<on?` on ${A('a-seg')}`:''}" style="animation-delay:${(i*.05).toFixed(2)}s" d="M${pt(a0)}A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${pt(a1)}"/>`;}return `<div class="ring" role="img" aria-label="${E(done)} trên ${E(goal)} câu mới hôm nay${check?', đã ôn xong':''}"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">${segs}</svg><span class="ring-num mono" aria-hidden="true"><span>${E(Math.min(done,goal))}<small>/${E(goal)}</small></span></span>${check?`<span class="ring-check" aria-hidden="true">${icon(CHECK,14)}</span>`:''}</div>`;}
function goalPanel(g,line,suffix=false){if(!g?.dailyGoal)return '';const reviewed=g.dueCount===0;return `<div class="goal-panel">${ring(g.newToday,g.dailyGoal,reviewed)}<div class="goal-text"><span class="eyebrow with-info">Mục tiêu hôm nay${infoButton('goal','Mục tiêu hôm nay')}</span><b>${g.newToday>g.dailyGoal?`${E(g.dailyGoal)}/${E(g.dailyGoal)} câu mới · thêm ${E(g.newToday-g.dailyGoal)}`:`${E(g.newToday)}/${E(g.dailyGoal)} câu mới`}${suffix&&reviewed?' · đã ôn xong':''}</b><span>${line}</span></div></div>`;}
// XP, newly mastered questions, the goal ring and tomorrow's reviews all come from the session view.

function finishMarkup(){if(completionPage.sessionId!==view.sessionId)completionPage={sessionId:view.sessionId,stage:'celebration'};if(completionPage.stage==='details')return finishDetailsMarkup();const v=view,r=v.sessionResults||{},leftover=v.status!=='complete';return `<section class="completion-hero"><div class="completion-art" aria-hidden="true"><div class="burst">${animate&&!leftover?`<div class="lesson-confetti">${LESSON_CONFETTI}</div>`:''}<div class="trophy ${A('a-pop')}">${COMPLETION_TROPHY}</div></div></div><p class="eyebrow">Mỗi bài học, một bước tiến</p><h2 class="finish-title" tabindex="-1" data-focus>${leftover?'Tạm xong bài này':'Hoàn thành bài học!'}</h2><p class="lead">${leftover?`Còn ${E(v.skippedPending)} câu bỏ qua — vẫn cần ôn`:'Bạn vừa tiến thêm một bước trên hành trình lái xe.'}</p><div class="tiles finish-tiles"><div class="stat-tile inv"><b class="mono">${signedXp(v.xp??0)}</b><span class="with-info">XP${infoButton('xp','XP')}</span></div><div class="stat-tile"><b class="mono">${E(r.correct??0)}<small>/${E(r.answered??0)}</small></b><span>Trả lời đúng</span></div><div class="stat-tile"><b class="mono"><span data-count="${E(!v.masteredCount&&v.firstCorrectCount>0?v.firstCorrectCount:v.masteredCount??0)}">${E(!v.masteredCount&&v.firstCorrectCount>0?v.firstCorrectCount:v.masteredCount??0)}</span></b><span>${!v.masteredCount&&v.firstCorrectCount>0?'câu đúng lần đầu':'câu mới thuộc'}</span></div></div><button class="btn press" data-action="finish-continue">Tiếp tục</button></section>`;}
