<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lý Thuyết Lái Xe · Thiết kế trải nghiệm ChatGPT</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="review-bar"><span>Bản mẫu · v3 <span class="desktop-only">· Trải nghiệm trong ChatGPT</span></span><div><button id="theme" aria-label="Đổi giao diện sáng tối">Sáng / Tối</button><button id="reset">Bắt đầu lại</button></div></div>
  <div class="workspace"><header><span>ChatGPT</span><span class="plugin-label">Lý Thuyết Lái Xe</span></header>
    <main id="conversation" aria-label="Cuộc trò chuyện học tập"><div id="user-message" class="user-message">Tôi muốn học bằng B, đi hết 600 câu trong 60 ngày.</div><div class="assistant-heading"><span class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h6a4 4 0 0 1 3 1.4A4 4 0 0 1 15 5h6v14h-6a4 4 0 0 0-3 1.4A4 4 0 0 0 9 19H3z"/><path d="M12 6.4v14"/></svg></span><span>Lý Thuyết Lái Xe <small>qua ChatGPT</small></span></div><div id="coach"></div><section id="card" class="card" aria-label="Hoạt động học tập"></section><div id="followup"></div></main>
    <footer><form id="composer"><input id="message" aria-label="Nhắn yêu cầu học tập" placeholder="Hỏi điều bạn chưa hiểu…" autocomplete="off"><button type="submit" aria-label="Gửi tin nhắn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button></form><p class="disclosure">Bản mẫu: không lưu tài khoản, không gọi ChatGPT hay nguồn video. Tải lại sẽ đặt lại tiến độ mẫu.</p></footer>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
